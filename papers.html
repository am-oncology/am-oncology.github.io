<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadOnc Journals | Clinical Paper Feed</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --primary: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s ease, color 0.3s ease; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 50px;
        }

        /* Layout */
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
            aside { position: relative; top: 0; }
        }

        /* Sidebar & Filters */
        aside { position: sticky; top: 100px; height: fit-content; }

        .filter-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            margin-bottom: 1rem;
        }

        /* Buttons */
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            margin-top: 0.5rem;
        }

        /* Article Cards */
        .article {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1rem;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .article-header {
            padding: 1.25rem;
            cursor: pointer;
        }

        .article-header h2 { font-size: 1.1rem; margin-bottom: 0.5rem; line-height: 1.3; }

        .tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg);
            color: var(--muted);
            margin-right: 8px;
        }

        .article-details {
            display: none;
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background: rgba(0,0,0,0.02);
        }

        .open .article-details { display: block; }

        .abstract-text { font-size: 0.95rem; margin: 1rem 0; color: var(--text); opacity: 0.9; }

        .action-bar {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .action-link {
            font-size: 0.85rem;
            text-decoration: none;
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
        }

        /* Theme Toggle */
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        #loading { text-align: center; padding: 3rem; color: var(--muted); }
    </style>
</head>
<body data-theme="light">

    <header>
        <div class="header-content">
            <div>
                <h1 style="font-size: 1.5rem;">OncoStream</h1>
                <p style="font-size: 0.8rem; color: var(--muted);">Evidence-based feed for practicing oncologists</p>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>
        </div>
    </header>

    <div class="container">
        <aside>
            <div class="filter-card">
                <input type="text" id="query" class="search-input" placeholder="Search keywords (e.g. SBRT)..." onkeypress="if(event.key==='Enter') fetchPapers()">
                
                <div style="margin-bottom: 1rem;">
                    <p style="font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem;">JOURNALS</p>
                    <div id="journal-list"></div>
                </div>

                <button class="btn" onclick="fetchPapers()">Update Feed</button>
                <button class="btn btn-outline" onclick="showBookmarks()">⭐ Viewed Bookmarks</button>
            </div>
        </aside>

        <main>
            <div id="loading" style="display:none;">Refining search results...</div>
            <div id="results"></div>
        </main>
    </div>

    <script>
        const JOURNALS = [
            { name: 'IJROBP Red Journal (ASTRO)', query: '"Int J Radiat Oncol Biol Phys"[Journal]' },
            { name: 'PRO (ASTRO)', query: '"Pract Radiat Oncol"[Journal]' },
            { name: 'Advances (ASTRO)', query: '"Adv Radiat Oncol"[Journal]' },
            { name: 'Radiotherapy & Oncology Green Journal (ESTRO)', query: '"Radiother Oncol"[Journal]' },
            { name: 'tipsRO (ESTRO)', query: '"Tech Innov Patient Support Radiat Oncol"[Journal]' },
            { name: 'ctRO (ESTRO)', query: '"Clin Transl Radiat Oncol"[Journal]' },
            { name: 'phiRO (ESTRO)', query: '"Phys Imaging Radiat Oncol"[Journal]' },
            { name: 'Clinical Oncology (RCR)', query: '"Clin Oncol (R Coll Radiol)"[Journal]' },
            { name: 'x', query: '"x"[Journal]' },
            { name: 'Strahlentherapie und Onkologie (DEGRO)', query: '"Strahlenther Onkol"[Journal]' }
        ];

        let bookmarks = JSON.parse(localStorage.getItem('onco_bookmarks') || '[]');

        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }

        function init() {
            const list = document.getElementById('journal-list');
            JOURNALS.forEach((j, i) => {
                list.innerHTML += `
                    <label style="display: block; font-size: 0.9rem; margin-bottom: 5px; cursor:pointer;">
                        <input type="checkbox" value='${j.query}' checked> ${j.name}
                    </label>
                `;
            });
            fetchPapers();
        }

        async function fetchPapers() {
            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');
            const keyword = document.getElementById('query').value;
            const selected = Array.from(document.querySelectorAll('#journal-list input:checked')).map(i => i.value);

            if(!selected.length) return alert("Select at least one journal");

            resultsDiv.innerHTML = '';
            loading.style.display = 'block';

            let q = `(${selected.join(' OR ')})`;
            if(keyword) q += ` AND (${keyword})`;

            try {
                const search = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&retmode=json&retmax=25&sort=pub+date&term=${encodeURIComponent(q)}`);
                const { esearchresult: { idlist } } = await search.json();

                if(!idlist.length) {
                    resultsDiv.innerHTML = "<p>No recent papers found for this criteria.</p>";
                    return;
                }

                const details = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&retmode=xml&id=${idlist.join(',')}`);
                const xml = new DOMParser().parseFromString(await details.text(), "text/xml");
                render(xml.getElementsByTagName("PubmedArticle"));
            } catch (e) {
                resultsDiv.innerHTML = "Error connecting to PubMed.";
            } finally {
                loading.style.display = 'none';
            }
        }

        function render(articles) {
            const container = document.getElementById('results');
            Array.from(articles).forEach(art => {
                const pmid = art.querySelector("PMID").textContent;
                const title = art.querySelector("ArticleTitle").textContent;
                const journal = art.querySelector("ISOAbbreviation")?.textContent || "Journal";
                const date = art.querySelector("PubDate Year")?.textContent || "";
                
                let abs = "";
                art.querySelectorAll("AbstractText").forEach(node => {
                    const label = node.getAttribute("Label");
                    abs += `<p class="abstract-text">${label ? `<strong>${label}:</strong> ` : ''}${node.textContent}</p>`;
                });

                const div = document.createElement('div');
                div.className = 'article';
                div.innerHTML = `
                    <div class="article-header" onclick="this.parentElement.classList.toggle('open')">
                        <div><span class="tag">${journal}</span><span class="tag">${date}</span></div>
                        <h2>${title}</h2>
                        <div style="font-size: 0.8rem; color: var(--muted);">Click to expand abstract</div>
                    </div>
                    <div class="article-details">
                        ${abs || 'Abstract not available.'}
                        <div class="action-bar">
                            <a class="action-link" href="https://pubmed.ncbi.nlm.nih.gov/${pmid}" target="_blank">🔗 View on PubMed</a>
                            <span class="action-link" onclick="copyCitation('${pmid}')">📋 Copy PMID</span>
                            <span class="action-link" onclick="toggleBookmark('${pmid}', '${title.replace(/'/g, "\\'")}')">⭐ Save</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleBookmark(id, title) {
            if(!bookmarks.find(b => b.id === id)) {
                bookmarks.push({id, title});
                localStorage.setItem('onco_bookmarks', JSON.stringify(bookmarks));
                alert("Saved to local bookmarks");
            }
        }

        function showBookmarks() {
            const container = document.getElementById('results');
            if(!bookmarks.length) return alert("No bookmarks saved yet.");
            container.innerHTML = "<h3>Local Bookmarks</h3><br>";
            bookmarks.forEach(b => {
                container.innerHTML += `<div class="article" style="padding:15px;"><a href="https://pubmed.ncbi.nlm.nih.gov/${b.id}" target="_blank" style="color:var(--accent); text-decoration:none;">${b.title}</a></div>`;
            });
        }

        function copyCitation(pmid) {
            navigator.clipboard.writeText(`PMID: ${pmid}`);
            alert("PMID copied to clipboard");
        }

        init();
    </script>
</body>
</html>
