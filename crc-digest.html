<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Colorectal Oncology Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* STYLING EXACTLY MATCHING YOUR CNS-DIGEST */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #F5F0E8; --cream-dark: #EDE6D6; --ink: #1A1410; --ink-light: #3D3530;
  --muted: #8A7E74; --rule: #C8BFB0; --surface: #FDFAF4;
  --tab-accent: #7A1E2E;
}
body { background: var(--cream); color: var(--ink); font-family: 'Source Serif 4', serif; line-height: 1.6; }

/* MASTHEAD */
.masthead { background: var(--ink); color: var(--cream); position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--tab-accent); }
.masthead-inner { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 50px; }
.masthead-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; }
.masthead-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }

/* TABS */
.tabs-wrap { background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); }
.tabs { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; }
.tab { 
    background: none; border: none; color: rgba(255,255,255,0.5); padding: 1rem 1.5rem; 
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; cursor: pointer; border-bottom: 3px solid transparent;
}
.tab.active { color: #fff; border-bottom-color: var(--tab-accent); }

/* HERO */
.hero { background: var(--ink); color: #fff; padding: 4rem 2rem; }
.hero-inner { max-width: 1200px; margin: 0 auto; }
.hero h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 1rem; }
.hero h1 em { color: #C88888; font-style: italic; }

/* MAIN CONTENT */
.main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
.search-bar { width: 100%; padding: 1rem; border: 1px solid var(--rule); margin-bottom: 2rem; font-family: 'Source Serif 4', serif; background: var(--surface); }

.paper-row { border-bottom: 1px solid var(--rule); padding: 1.5rem 0; cursor: pointer; transition: 0.2s; }
.paper-row:hover { background: rgba(0,0,0,0.02); }
.paper-journal { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--tab-accent); text-transform: uppercase; display: block; margin-bottom: 0.5rem; }
.paper-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; margin-bottom: 0.5rem; }
.paper-authors { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }

.drawer { display: none; background: #fff; padding: 1.5rem; border: 1px solid var(--rule); margin-top: 1rem; font-size: 0.95rem; line-height: 1.8; }
.drawer.open { display: block; }
</style>
</head>
<body>

<nav class="masthead">
  <div class="masthead-inner">
    <div class="masthead-title">Colorectal Oncology Digest</div>
    <div class="masthead-meta" id="date-display">Daily Feed</div>
  </div>
</nav>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" data-term="rectal+cancer[MeSH]" onclick="switchTab(this, '#7A1E2E')">Rectal</button>
    <button class="tab" data-term="colonic+neoplasms[MeSH]" onclick="switchTab(this, '#1A5C5A')">Colon</button>
    <button class="tab" data-term="anus+neoplasms[MeSH]" onclick="switchTab(this, '#1E3A5F')">Anal</button>
    <button class="tab" data-term="appendiceal+neoplasms[MeSH]" onclick="switchTab(this, '#B8860B')">Appendix</button>
  </div>
</div>

<header class="hero">
  <div class="hero-inner">
    <h1 id="hero-title">Rectal Cancer<br><em>Research Digest</em></h1>
  </div>
</header>

<main class="main">
  <input type="text" class="search-bar" id="search" placeholder="Filter papers..." oninput="renderPapers()">
  <div id="papers-list">Loading papers...</div>
</main>

<script>
let allPapers = [];

async function fetchPapers(term) {
  const list = document.getElementById('papers-list');
  list.innerHTML = "Fetching latest research...";
  
  try {
    const search = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&retmode=json&retmax=10&term=${term}`);
    const searchData = await search.json();
    const ids = searchData.esearchresult.idlist.join(',');

    const summary = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&retmode=json&id=${ids}`);
    const summaryData = await summary.json();

    allPapers = searchData.esearchresult.idlist.map(id => ({
      id,
      title: summaryData.result[id].title,
      journal: summaryData.result[id].source,
      authors: summaryData.result[id].authors.map(a => a.name).join(', ')
    }));

    renderPapers();
  } catch (e) {
    list.innerHTML = "Error loading papers.";
  }
}

function renderPapers() {
  const query = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('papers-list');
  const filtered = allPapers.filter(p => p.title.toLowerCase().includes(query));

  list.innerHTML = filtered.map(p => `
    <div class="paper-row" onclick="toggleDrawer('${p.id}')">
      <span class="paper-journal">${p.journal}</span>
      <h2 class="paper-title">${p.title}</h2>
      <p class="paper-authors">${p.authors}</p>
      <div class="drawer" id="drawer-${p.id}">Loading abstract...</div>
    </div>
  `).join('');
}

async function toggleDrawer(id) {
  const drawer = document.getElementById(`drawer-${id}`);
  drawer.classList.toggle('open');
  
  if (drawer.classList.contains('open') && drawer.innerText === "Loading abstract...") {
    const res = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=${id}&retmode=xml`);
    const xmlText = await res.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, "text/xml");
    const abstract = xml.getElementsByTagName("AbstractText")[0]?.textContent || "No abstract available.";
    drawer.innerText = abstract;
  }
}

function switchTab(btn, color) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.documentElement.style.setProperty('--tab-accent', color);
  document.getElementById('hero-title').innerHTML = `${btn.innerText} Cancer<br><em>Research Digest</em>`;
  fetchPapers(btn.dataset.term);
}

document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
fetchPapers('rectal+cancer[MeSH]');
</script>
</body>
</html>
