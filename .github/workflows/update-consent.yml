name: Update consent

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to refresh (any of: rcr cruk macmillan custom)"
        required: false
        default: "rcr cruk macmillan custom"
  push:
    paths:
      - "consent/custom/**"

permissions:
  contents: write
  pages: write

concurrency:
  group: consent-library
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-consent.txt

      - name: Install tools
        run: |
          pip install -r scripts/requirements-consent.txt
          python -m playwright install --with-deps chromium

      - name: Build library
        env:
          SOURCES: ${{ github.event_name == 'push' && 'custom' || inputs.sources || 'rcr cruk macmillan custom' }}
        run: python scripts/update_consent_library.py --sources $SOURCES

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consent/library
          if git diff --cached --quiet; then
            echo "Library unchanged"
            exit 0
          fi
          git commit -m "Update consent library ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash
          git push

      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
