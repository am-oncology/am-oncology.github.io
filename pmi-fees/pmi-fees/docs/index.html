<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fee schedules</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>£</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F3F5F7; --surface: #FFFFFF; --ink: #16243A; --muted: #5E6B7A; --rule: #DCE2E8;
  --signal: #1F6B57; --signal-tint: #E3F0EB; --stale: #9A5B12; --stale-tint: #F7EEDF; --focus: #2E5FA8;
  --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171E; --surface: #1A212B; --ink: #E6EBF1; --muted: #9AA6B4; --rule: #2A3441;
    --signal: #6CC3A6; --signal-tint: #1C3029; --stale: #E0A85A; --stale-tint: #2E2618; --focus: #8DB4F0;
  }
}
:root[data-theme="dark"] {
  --paper: #12171E; --surface: #1A212B; --ink: #E6EBF1; --muted: #9AA6B4; --rule: #2A3441;
  --signal: #6CC3A6; --signal-tint: #1C3029; --stale: #E0A85A; --stale-tint: #2E2618; --focus: #8DB4F0;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 28px 24px 64px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
h1 { font: 600 28px/1.15 var(--serif); margin: 0; letter-spacing: -0.01em; }
.generated { color: var(--muted); font-size: 13px; }

.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.layout > * { min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; }
.panel + .panel { margin-top: 16px; }
h2 { font: 600 15px/1.3 var(--sans); margin: 0 0 10px; }
label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input[type="search"], select {
  width: 100%; padding: 9px 11px; background: var(--paper); border: 1px solid var(--rule); border-radius: 7px;
  min-height: 40px; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.row { display: flex; gap: 8px; align-items: end; margin-top: 12px; }
.row > :first-child { flex: 1; min-width: 0; }

.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 7px; padding: 8px 12px; cursor: pointer; min-height: 40px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 6px; min-height: 0; }
.btn.quiet:hover { color: var(--ink); }

.results { list-style: none; margin: 12px 0 0; padding: 0; max-height: 340px; overflow-y: auto; }
.results li button { display: grid; grid-template-columns: 62px 1fr; gap: 8px; width: 100%; text-align: left; background: none;
  border: 0; border-top: 1px solid var(--rule); padding: 8px 2px; cursor: pointer; }
.results li:first-child button { border-top: 0; }
.results li button:hover { background: var(--paper); }
.results li button[aria-pressed="true"] { color: var(--muted); }
.results li button[aria-pressed="true"] .code::after { content: " ✓"; color: var(--signal); }
.code { font-weight: 600; font-variant-numeric: tabular-nums; }
.desc { font-size: 13px; line-height: 1.4; }
.hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

.mine-head { display: flex; justify-content: space-between; align-items: baseline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; font-weight: 600; background: var(--paper); }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); width: 22px; height: 22px; border-radius: 50%; }
.chip button:hover { color: var(--ink); background: var(--rule); }

.ins-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.insurers { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.ins { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--rule); background: var(--surface); border-radius: 9px; padding: 9px 12px 9px 10px; cursor: pointer; }
.ins input { margin: 3px 0 0; accent-color: var(--ink); }
.ins strong { display: block; font-weight: 600; font-size: 14px; }
.ins span { display: block; font-size: 12px; color: var(--muted); }
.ins.stale span.when, .ins.failed span.when { color: var(--stale); }
.ins:has(input:checked) { border-color: var(--ink); }

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; vertical-align: top; padding: 11px 12px; border-bottom: 1px solid var(--rule); }
thead th { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface); position: sticky; top: 0; }
thead th.num { text-align: right; }
tbody tr:last-child > * { border-bottom: 0; }
th.proc { position: sticky; left: 0; background: var(--surface); font-weight: 400; min-width: 190px; max-width: 300px; z-index: 1; box-shadow: 1px 0 0 var(--rule); }
th.proc .desc { color: var(--muted); display: block; margin-top: 2px; }
td.fee { text-align: right; cursor: pointer; white-space: nowrap; }
td.fee:hover { background: var(--paper); }
td.fee .amt { font: 400 20px/1.15 var(--serif); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.01em; }
td.fee .sub { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
td.fee.top { background: var(--signal-tint); }
td.fee.top .amt { color: var(--signal); font-weight: 600; }
td.fee.none { cursor: default; }
td.fee.none:hover { background: none; }
td.fee.none .amt { color: var(--muted); font-size: 14px; font-family: var(--sans); }
td.fee.old .sub.when { color: var(--stale); }
td.fee[aria-expanded="true"] { box-shadow: inset 0 -2px 0 var(--ink); }
tr.detail td { background: var(--paper); padding: 14px 16px 18px; font-size: 14px; }
.detail-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; max-width: 78ch; margin: 0; }
.detail-grid dt { color: var(--muted); }
.detail-grid dd { margin: 0; }
a { color: var(--focus); }

.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.legend { color: var(--muted); font-size: 13px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--signal-tint); border: 1px solid var(--signal); margin-right: 6px; vertical-align: -1px; }

.empty { background: var(--surface); border: 1px dashed var(--rule); border-radius: 10px; padding: 36px 24px; color: var(--muted); }
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; font-weight: 600; }

.changes { margin-top: 28px; }
.changes-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.changes ol { list-style: none; padding: 0; margin: 8px 0 0; }
.changes li { display: grid; grid-template-columns: 92px 62px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.changes li .when { color: var(--muted); font-variant-numeric: tabular-nums; }
.changes .up { color: var(--signal); } .changes .down { color: var(--stale); }
@media (prefers-reduced-motion: no-preference) { tr.detail td > * { animation: open .16s ease-out; } }
@keyframes open { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fee schedules</h1>
    <span class="generated" id="generated"></span>
  </header>

  <div class="layout">
    <aside>
      <section class="panel" aria-labelledby="find-h">
        <h2 id="find-h">Add codes</h2>
        <label class="field" for="q">Search by CCSD code or description</label>
        <input type="search" id="q" placeholder="e.g. X0003 or intrathecal" autocomplete="off">
        <ul class="results" id="results" aria-live="polite"></ul>
        <div class="row">
          <div>
            <label class="field" for="section">Or add a whole section</label>
            <select id="section"><option value="">Choose a section</option></select>
          </div>
          <button class="btn" id="add-section" type="button">Add all</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="mine-h">
        <div class="mine-head">
          <h2 id="mine-h">Your codes <span id="mine-count" class="generated"></span></h2>
          <button class="btn quiet" id="clear" type="button">Clear</button>
        </div>
        <div class="chips" id="chips"></div>
        <p class="hint" id="mine-hint">Codes you add stay here next time you open the page.</p>
      </section>
    </aside>

    <main>
      <div class="ins-head"><span class="generated">Insurers to compare</span>
        <span><button class="btn quiet" id="ins-all" type="button">Select all</button><button class="btn quiet" id="ins-none" type="button">Clear</button></span></div>
      <fieldset class="insurers" id="insurers" style="border:0;padding:0;margin:0 0 16px"><legend class="visually-hidden">Insurers to compare</legend></fieldset>
      <div id="table-area"></div>
      <div class="toolbar" id="toolbar" hidden>
        <span class="legend"><i></i>Highest maximum for that code. Select a fee for notes and billing rules.</span>
        <button class="btn" id="export" type="button">Export CSV</button>
      </div>

      <section class="changes" aria-labelledby="changes-h">
        <div class="changes-head">
          <h2 id="changes-h">Recent fee changes</h2>
          <label class="generated"><input type="checkbox" id="only-mine" checked> Only your codes</label>
        </div>
        <ol id="changes"></ol>
      </section>
    </main>
  </div>
</div>

<script>
(() => {
  const ORDER = ["axa_fa", "axa_fl", "bupa", "aviva", "vitality", "wpa", "exeter", "freedom", "allianz", "healix", "cshealthcare"];
  const STALE_DAYS = { manual: 60, auto: 3 };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = Object.assign(document.createElement(tag), props);
    kids.flat().forEach(k => k != null && n.append(k));
    return n;
  };
  const money = (v) => v == null ? "" : "£" + Number(v).toLocaleString("en-GB", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  const day = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "never";
  const ageDays = (iso) => iso ? (Date.now() - new Date(iso)) / 864e5 : Infinity;

  let data = { codes: {}, sources: {} }, changes = [], sourceIds = [];
  let mine = store.get("pmi.codes", []);
  let shown = store.get("pmi.insurers", null);
  let open = null; // "CODE|sid" of the expanded cell

  function sectionOf(code) {
    const f = data.codes[code]?.fees || {};
    for (const sid of ORDER) if (f[sid]?.section) return f[sid].chapter ? `${f[sid].chapter}: ${f[sid].section}` : f[sid].section;
    return "";
  }
  function asOf(sid, entry) { return entry?.as_of || data.sources[sid]?.last_success; }
  function label(sid) { const s = data.sources[sid]; return s ? (sourceIds.filter(x => data.sources[x].insurer === s.insurer).length > 1 ? `${s.insurer} ${s.schedule.toLowerCase()}` : s.insurer) : sid; }

  function saveMine() { store.set("pmi.codes", mine); }
  function add(codes) { codes.forEach(c => { if (!mine.includes(c)) mine.push(c); }); saveMine(); renderAll(); }
  function remove(code) { mine = mine.filter(c => c !== code); saveMine(); renderAll(); }

  function renderInsurers() {
    const box = $("insurers");
    box.querySelectorAll("label").forEach(n => n.remove());
    sourceIds.forEach(sid => {
      const s = data.sources[sid];
      const limit = s.manual ? STALE_DAYS.manual : STALE_DAYS.auto;
      let when;
      if (s.status === "failed") when = "not yet harvested";
      else if (s.status === "stale") when = `stale since ${day(s.last_success)}`;
      else if (s.manual) when = s.count ? `checked by hand, ${s.count} code${s.count === 1 ? "" : "s"}` : "no codes entered yet";
      else when = ageDays(s.last_success) > limit ? `last checked ${day(s.last_success)}` : `checked ${day(s.last_success)}`;
      const cls = s.status === "stale" || s.status === "failed" || (!s.manual && ageDays(s.last_success) > limit) ? "stale" : "";
      const cb = el("input", { type: "checkbox", checked: shown.includes(sid) });
      cb.addEventListener("change", () => { shown = cb.checked ? ORDER.filter(x => x === sid || shown.includes(x)) : shown.filter(x => x !== sid); store.set("pmi.insurers", shown); renderTable(); });
      const lab = el("label", { className: `ins ${cls}`, title: s.error || "" }, cb,
        el("div", {}, el("strong", { textContent: label(sid) }), el("span", { className: "when", textContent: when })));
      box.append(lab);
    });
  }

  function renderSearch() {
    const q = $("q").value.trim().toLowerCase();
    const ul = $("results"); ul.replaceChildren();
    if (!q) return;
    const words = q.split(/\s+/);
    const hits = [];
    for (const [code, c] of Object.entries(data.codes)) {
      const hay = (code + " " + (c.description || "")).toLowerCase();
      if (code.toLowerCase().startsWith(q) || words.every(w => hay.includes(w))) hits.push(code);
      if (hits.length >= 60) break;
    }
    if (!hits.length) { ul.append(el("li", { className: "hint", textContent: "No codes match. Try fewer words, or the code's first letters." })); return; }
    hits.forEach(code => {
      const b = el("button", { type: "button" }, el("span", { className: "code", textContent: code }), el("span", { className: "desc", textContent: data.codes[code].description || "No description" }));
      b.setAttribute("aria-pressed", mine.includes(code));
      b.addEventListener("click", () => mine.includes(code) ? remove(code) : add([code]));
      ul.append(el("li", {}, b));
    });
  }

  function renderSections() {
    const sel = $("section");
    const groups = {};
    Object.keys(data.codes).forEach(code => { const s = sectionOf(code); if (s) (groups[s] ||= []).push(code); });
    Object.keys(groups).sort((a, b) => a.localeCompare(b, "en", { numeric: true })).forEach(s =>
      sel.append(el("option", { value: s, textContent: `${s} (${groups[s].length})` })));
    $("add-section").onclick = () => { if (groups[sel.value]) add(groups[sel.value]); };
  }

  function renderChips() {
    const box = $("chips"); box.replaceChildren();
    mine.forEach(code => {
      const x = el("button", { type: "button", textContent: "×", ariaLabel: `Remove ${code}` });
      x.addEventListener("click", () => remove(code));
      box.append(el("span", { className: "chip", title: data.codes[code]?.description || "" }, code, x));
    });
    $("mine-count").textContent = mine.length ? `(${mine.length})` : "";
    $("mine-hint").hidden = mine.length > 0;
    $("clear").hidden = !mine.length;
  }

  function renderTable() {
    const area = $("table-area"); area.replaceChildren();
    $("toolbar").hidden = true;
    if (!data.generated_at) {
      area.append(el("div", { className: "empty" }, el("strong", { textContent: "No fee data yet" }),
        "Run the “Nightly fee harvest” workflow from the Actions tab on GitHub, wait a few minutes for the site to redeploy, then reload this page."));
      return;
    }
    if (!mine.length) {
      area.append(el("div", { className: "empty" }, el("strong", { textContent: "Nothing to compare yet" }),
        "Search for a code or add a whole section on the left. Your list is kept for next time."));
      return;
    }
    if (!shown.length) {
      area.append(el("div", { className: "empty" }, el("strong", { textContent: "No insurers selected" }), "Tick at least one insurer above."));
      return;
    }
    const thead = el("thead", {}, el("tr", {}, el("th", { className: "proc", textContent: "Procedure" }),
      shown.map(sid => el("th", { className: "num", scope: "col", textContent: label(sid) }))));
    const tbody = el("tbody");
    mine.forEach(code => {
      const c = data.codes[code];
      const fees = shown.map(sid => c?.fees?.[sid]?.fee ?? null);
      const max = Math.max(...fees.filter(v => v != null));
      const listed = fees.filter(v => v != null).length;
      const tr = el("tr", {}, el("th", { className: "proc", scope: "row" },
        el("span", { className: "code", textContent: code }),
        el("span", { className: "desc", textContent: c?.description || "Not in any harvested schedule" })));
      shown.forEach((sid, i) => {
        const e = c?.fees?.[sid];
        const key = `${code}|${sid}`;
        const td = el("td", { className: "fee" });
        if (!e) {
          td.classList.add("none");
          td.append(el("span", { className: "amt", textContent: data.sources[sid]?.count ? "Not listed" : "No data yet" }));
          tr.append(td);
          return;
        } else {
          td.tabIndex = 0;
          td.setAttribute("aria-expanded", open === key);
          if (listed > 1 && e.fee === max) td.classList.add("top");
          const old = ageDays(asOf(sid, e)) > (data.sources[sid]?.manual ? STALE_DAYS.manual : STALE_DAYS.auto);
          if (old) td.classList.add("old");
          td.append(el("span", { className: "amt", textContent: money(e.fee) }));
          const bits = [e.anaes ? `Anaesthetist ${money(e.anaes)}` : "", e.complexity || ""].filter(Boolean).join(", ");
          if (bits) td.append(el("span", { className: "sub", textContent: bits }));
          if (old) td.append(el("span", { className: "sub when", textContent: `as of ${day(asOf(sid, e))}` }));
        }
        const toggle = () => { open = open === key ? null : key; renderTable(); };
        td.addEventListener("click", toggle);
        td.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); } });
        tr.append(td);
      });
      tbody.append(tr);
      const [oc, osid] = (open || "").split("|");
      if (oc === code && shown.includes(osid) && c?.fees?.[osid]) tbody.append(detailRow(code, osid, c.fees[osid]));
    });
    area.append(el("div", { className: "tablewrap" }, el("table", {}, thead, tbody)));
    $("toolbar").hidden = false;
  }

  function detailRow(code, sid, e) {
    const dl = el("dl", { className: "detail-grid" });
    const add = (k, v) => { if (v) dl.append(el("dt", { textContent: k }), el("dd", {}, v)); };
    add("Schedule", label(sid));
    add("Section", [e.chapter, e.section].filter(Boolean).join(": "));
    add("Procedure fee", money(e.fee));
    add("Anaesthetist", e.anaes != null ? money(e.anaes) : "");
    add("Complexity", e.complexity);
    add("Insurer notes", e.notes);
    add("Not billable with", e.unacceptable?.length ? e.unacceptable.join(", ") : "");
    add("Fee as of", day(asOf(sid, e)));
    const url = e.source_url && /^https?:/.test(e.source_url) ? e.source_url : data.sources[sid]?.source_url;
    if (url && /^https?:/.test(url)) add("Source", el("a", { href: url, target: "_blank", rel: "noopener", textContent: "Open the insurer's page" }));
    return el("tr", { className: "detail" }, el("td", { colSpan: shown.length + 1 }, dl));
  }

  function renderChanges() {
    const ol = $("changes"); ol.replaceChildren();
    const onlyMine = $("only-mine").checked;
    const list = changes.filter(c => !onlyMine || mine.includes(c.code)).slice(0, 40);
    if (!list.length) { ol.append(el("li", { className: "hint", style: "display:block", textContent: onlyMine ? "No changes to your codes since harvesting began." : "No changes recorded yet." })); return; }
    list.forEach(c => {
      let what;
      if (c.kind === "added") what = `Added to ${label(c.source)} at ${money(c.new)}`;
      else if (c.kind === "removed") what = `Removed from ${label(c.source)} (was ${money(c.old)})`;
      else if (c.kind === "complexity") what = `${label(c.source)} complexity ${c.old || "none"} to ${c.new || "none"}`;
      else {
        const dir = (c.new ?? 0) > (c.old ?? 0) ? "up" : "down";
        what = el("span", {}, `${label(c.source)} ${c.kind === "anaes" ? "anaesthetist fee" : "fee"} ${money(c.old)} to `, el("span", { className: dir, textContent: money(c.new) }));
      }
      ol.append(el("li", {}, el("span", { className: "when", textContent: day(c.at) }), el("span", { className: "code", textContent: c.code }), el("span", {}, what)));
    });
  }

  function exportCsv() {
    const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const head = ["Code", "Description", ...shown.flatMap(sid => [`${label(sid)} fee`, `${label(sid)} anaesthetist`, `${label(sid)} as of`])];
    const rows = mine.map(code => {
      const c = data.codes[code] || {};
      return [code, c.description, ...shown.flatMap(sid => { const e = c.fees?.[sid]; return e ? [e.fee, e.anaes ?? "", asOf(sid, e)?.slice(0, 10)] : ["", "", ""]; })];
    });
    const csv = [head, ...rows].map(r => r.map(esc).join(",")).join("\r\n");
    const a = el("a", { href: URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" })), download: `pmi-fees-${new Date().toISOString().slice(0, 10)}.csv` });
    document.body.append(a); a.click(); a.remove();
  }

  function renderAll() { renderChips(); renderSearch(); renderTable(); renderChanges(); }

  async function load() {
    try {
      const [f, ch] = await Promise.all([
        fetch("data/fees.json", { cache: "no-cache" }).then(r => r.json()),
        fetch("data/changes.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : []).catch(() => [])
      ]);
      data = f; changes = ch;
    } catch (err) {
      $("table-area").append(el("div", { className: "empty" }, el("strong", { textContent: "The fee data could not be loaded" }),
        "data/fees.json is missing or unreadable. Check the latest harvest run on GitHub."));
      return;
    }
    sourceIds = ORDER.filter(sid => data.sources?.[sid]).concat(Object.keys(data.sources || {}).filter(s => !ORDER.includes(s)));
    if (!shown) shown = sourceIds.filter(sid => sid !== "axa_fl" && data.sources[sid].count);
    shown = shown.filter(sid => sourceIds.includes(sid));
    $("generated").textContent = data.generated_at ? `Data refreshed ${day(data.generated_at)}` : "";
    renderInsurers(); renderSections(); renderAll();
  }

  $("ins-all").addEventListener("click", () => { shown = [...sourceIds]; store.set("pmi.insurers", shown); renderInsurers(); renderTable(); });
  $("ins-none").addEventListener("click", () => { shown = []; store.set("pmi.insurers", shown); renderInsurers(); renderTable(); });
  $("q").addEventListener("input", renderSearch);
  $("clear").addEventListener("click", () => { mine = []; saveMine(); renderAll(); });
  $("only-mine").addEventListener("change", renderChanges);
  $("export").addEventListener("click", exportCsv);
  load();
})();
</script>
</body>
</html>
