<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oncology Consent & Leaflet Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-8">
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 p-6 sm:p-8">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">📄 Oncology Consent & Leaflet Generator</h1>
        <p class="text-sm text-slate-500">Search auto-updated RCR and CRUK consent forms and Macmillan leaflets.</p>
      </div>
      <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
        🔒 Client-Side Executed
      </span>
    </div>

    <!-- Patient Details Form -->
    <form id="consent-form" class="space-y-6">
      <div>
        <h2 class="text-lg font-semibold text-slate-800 mb-3">1. Patient Demographics</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 uppercase">Full Name</label>
            <input type="text" id="patientName" required class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 uppercase">Date of Birth</label>
            <input type="date" id="dob" required class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 uppercase">NHS Number</label>
            <input type="text" id="nhsNumber" required class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 uppercase">Hospital Number</label>
            <input type="text" id="hospitalNumber" class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-slate-700 uppercase">Responsible Consultant</label>
            <input type="text" id="consultant" class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>
      </div>

      <!-- Live Search & Select Forms -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-lg font-semibold text-slate-800">2. Search & Select Consent Forms</h2>
          <span id="form-count" class="text-xs text-slate-500">Loading forms...</span>
        </div>
        
        <input type="text" id="search-input" placeholder="🔍 Type regimen or site (e.g. Prostate, Capecitabine, Breast, Lung)..." class="w-full mb-3 p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">

        <div id="forms-list" class="space-y-2 border rounded-lg p-4 bg-slate-50 max-h-72 overflow-y-auto">
          <!-- Populated dynamically from database.json -->
        </div>
      </div>

      <!-- Action Button -->
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg shadow transition duration-150">
        Generate Filled Forms & Package ZIP
      </button>
    </form>

    <!-- Status Output and Links -->
    <div id="status" class="mt-4 text-sm font-medium"></div>
    <div id="leaflet-links" class="mt-3 space-y-1"></div>
  </div>

  <script>
    let formDatabase = [];

    // Load database.json generated by GitHub Actions
    async function loadDatabase() {
      try {
        const res = await fetch('./database.json');
        if (!res.ok) throw new Error("Could not load database.json");
        formDatabase = await res.json();
        document.getElementById('form-count').innerText = `${formDatabase.length} forms available`;
        renderForms(formDatabase);
      } catch (e) {
        document.getElementById('forms-list').innerHTML = `<p class="text-xs text-red-500">Error loading forms database: ${e.message}</p>`;
      }
    }

    function renderForms(items) {
      const container = document.getElementById('forms-list');
      if (items.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500">No matching forms found.</p>';
        return;
      }
      container.innerHTML = items.map(item => `
        <label class="flex items-start space-x-3 cursor-pointer p-1.5 hover:bg-slate-100 rounded">
          <input type="checkbox" value="${item.id}" class="treatment-checkbox mt-1 h-4 w-4 rounded text-blue-600">
          <div>
            <span class="text-sm font-medium text-slate-900">${item.title}</span>
            <span class="ml-2 text-xs text-slate-400">(${item.category})</span>
          </div>
        </label>
      `).join('');
    }

    // Filter list as user types
    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = formDatabase.filter(f => f.title.toLowerCase().includes(q) || f.category.toLowerCase().includes(q));
      renderForms(filtered);
    });

    async function fetchRemotePdf(url) {
      const corsProxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
      const response = await fetch(corsProxy);
      if (!response.ok) throw new Error(`Failed to download from ${url}`);
      return await response.arrayBuffer();
    }

    document.getElementById('consent-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      const leafletContainer = document.getElementById('leaflet-links');
      
      status.className = "mt-4 text-sm font-medium text-blue-600";
      status.innerText = "⏳ Fetching selected blank PDFs and filling details...";
      leafletContainer.innerHTML = "";

      const patientData = {
        name: document.getElementById('patientName').value,
        dob: document.getElementById('dob').value,
        nhsNumber: document.getElementById('nhsNumber').value,
        hospitalNumber: document.getElementById('hospitalNumber').value,
        consultant: document.getElementById('consultant').value
      };

      const selectedIds = Array.from(document.querySelectorAll('.treatment-checkbox:checked')).map(cb => cb.value);

      if (selectedIds.length === 0) {
        status.className = "mt-4 text-sm font-medium text-red-600";
        status.innerText = "⚠️ Please select at least one form.";
        return;
      }

      const zip = new JSZip();
      const safeName = patientData.name.replace(/\s+/g, '_');

      try {
        for (const id of selectedIds) {
          const item = formDatabase.find(f => f.id === id);
          if (!item) continue;

          const pdfBytes = await fetchRemotePdf(item.templateUrl);
          const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
          const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);

          // Standard position filling
          const page = pdfDoc.getPages()[0];
          const { height } = page.getSize();
          const opts = { size: 10, font, color: PDFLib.rgb(0, 0, 0) };

          page.drawText(patientData.name, { x: 130, y: height - 145, ...opts });
          page.drawText(patientData.dob, { x: 410, y: height - 145, ...opts });
          page.drawText(patientData.nhsNumber, { x: 130, y: height - 170, ...opts });
          page.drawText(patientData.hospitalNumber, { x: 410, y: height - 170, ...opts });
          page.drawText(patientData.consultant, { x: 130, y: height - 195, ...opts });

          const filledPdfBytes = await pdfDoc.save();
          zip.file(`${safeName}_${item.id}.pdf`, filledPdfBytes);

          // Append clickable Macmillan leaflet link to prevent popup-blocker issues
          leafletContainer.innerHTML += `
            <a href="${item.macmillanUrl}" target="_blank" class="block text-xs text-blue-600 hover:underline">
              📖 Open Macmillan Information Leaflet for ${item.title} ↗
            </a>
          `;
        }

        const zipBlob = await zip.generateAsync({ type: "blob" });
        saveAs(zipBlob, `${safeName}_Consent_Package.zip`);

        status.className = "mt-4 text-sm font-medium text-emerald-600";
        status.innerText = "✅ Complete! Filled PDFs downloaded in ZIP package.";
      } catch (err) {
        status.className = "mt-4 text-sm font-medium text-red-600";
        status.innerText = `❌ Error: ${err.message}`;
      }
    });

    loadDatabase();
  </script>
</body>
</html>
