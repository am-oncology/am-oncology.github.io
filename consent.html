<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oncology Consent & Leaflet Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-8">
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 p-6 sm:p-8">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">📄 Oncology Consent & Leaflet Generator</h1>
        <p class="text-sm text-slate-500">Auto-fills RCR/CRUK forms and fetches Macmillan info leaflets.</p>
      </div>
      <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
        🔒 100% Client-Side Processing
      </span>
    </div>

    <!-- Patient Details Form -->
    <form id="consent-form" class="space-y-6">
      <div>
        <h2 class="text-lg font-semibold text-slate-800 mb-3">1. Patient Demographics</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 uppercase">Full Name</label>
            <input type="text" id="patientName" required class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 uppercase">Date of Birth</label>
            <input type="date" id="dob" required class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 uppercase">NHS Number</label>
            <input type="text" id="nhsNumber" required class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 uppercase">Hospital Number</label>
            <input type="text" id="hospitalNumber" class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-slate-700 uppercase">Responsible Consultant</label>
            <input type="text" id="consultant" class="mt-1 block w-full rounded-md border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>
      </div>

      <!-- Treatment & Consent Selection -->
      <div>
        <h2 class="text-lg font-semibold text-slate-800 mb-3">2. Select Treatments & Consent Forms</h2>
        <div class="space-y-3 border rounded-lg p-4 bg-slate-50">
          <label class="flex items-start space-x-3 cursor-pointer">
            <input type="checkbox" value="breast_rt" class="treatment-checkbox mt-1 h-4 w-4 rounded text-blue-600 focus:ring-blue-500">
            <div>
              <span class="text-sm font-medium text-slate-900">RCR Breast Radiotherapy Consent Form</span>
              <p class="text-xs text-slate-500">Fetches RCR PDF & opens Macmillan Breast Radiotherapy leaflet</p>
            </div>
          </label>
          <label class="flex items-start space-x-3 cursor-pointer">
            <input type="checkbox" value="capecitabine" class="treatment-checkbox mt-1 h-4 w-4 rounded text-blue-600 focus:ring-blue-500">
            <div>
              <span class="text-sm font-medium text-slate-900">CRUK Capecitabine SACT Consent Form</span>
              <p class="text-xs text-slate-500">Fetches CRUK PDF & opens Macmillan Capecitabine leaflet</p>
            </div>
          </label>
        </div>
      </div>

      <!-- Submit Button -->
      <div>
        <button type="submit" id="generate-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg shadow transition duration-150 flex items-center justify-center space-x-2">
          <span>Fetch Online Forms, Auto-Fill & Download ZIP</span>
        </button>
      </div>
    </form>

    <!-- Status Output -->
    <div id="status" class="mt-4 text-sm font-medium"></div>
  </div>

  <script>
    // Configuration mapping treatments to online PDF templates & Macmillan links
    const TREATMENTS = {
      breast_rt: {
        name: "RCR_Breast_Radiotherapy",
        templateUrl: "https://www.rcr.ac.uk/media/3446/download",
        macmillanUrl: "https://www.macmillan.org.uk/cancer-information-and-support/treatments-and-drugs/radiotherapy-for-breast-cancer",
        // Coordinate fallbacks for flat non-interactive PDFs
        coordinates: {
          name: { x: 130, yOffset: 145 },
          dob: { x: 410, yOffset: 145 },
          nhs: { x: 130, yOffset: 170 },
          hospital: { x: 410, yOffset: 170 },
          consultant: { x: 130, yOffset: 195 }
        }
      },
      capecitabine: {
        name: "CRUK_Capecitabine_SACT",
        templateUrl: "https://www.cancerresearchuk.org/sites/default/files/capecitabine_consent.pdf",
        macmillanUrl: "https://www.macmillan.org.uk/cancer-information-and-support/treatments-and-drugs/capecitabine",
        coordinates: {
          name: { x: 140, yOffset: 165 },
          dob: { x: 420, yOffset: 165 },
          nhs: { x: 140, yOffset: 190 },
          hospital: { x: 420, yOffset: 190 },
          consultant: { x: 140, yOffset: 215 }
        }
      }
    };

    // Fetch online PDF template via CORS Proxy
    async function fetchRemotePdf(url) {
      const corsProxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
      const response = await fetch(corsProxy);
      if (!response.ok) throw new Error(`Failed to download template from ${url}`);
      return await response.arrayBuffer();
    }

    // Overlay text or fill AcroForm fields
    async function fillPdf(pdfDoc, item, patientData) {
      const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
      let filledViaForm = false;

      // 1. Try filling interactive AcroForm fields first
      try {
        const form = pdfDoc.getForm();
        if (form.getFields().length > 0) {
          try { form.getTextField('PatientName').setText(patientData.name); } catch(e){}
          try { form.getTextField('DOB').setText(patientData.dob); } catch(e){}
          try { form.getTextField('NHSNumber').setText(patientData.nhsNumber); } catch(e){}
          try { form.getTextField('HospitalNumber').setText(patientData.hospitalNumber); } catch(e){}
          try { form.getTextField('Consultant').setText(patientData.consultant); } catch(e){}
          filledViaForm = true;
        }
      } catch (err) {
        // Fall back to coordinate overlay
      }

      // 2. Draw text at specific coordinates if not an interactive AcroForm
      if (!filledViaForm && item.coordinates) {
        const page = pdfDoc.getPages()[0];
        const { height } = page.getSize();
        const opts = { size: 10, font, color: PDFLib.rgb(0, 0, 0) };
        const coords = item.coordinates;

        if (patientData.name) page.drawText(patientData.name, { x: coords.name.x, y: height - coords.name.yOffset, ...opts });
        if (patientData.dob) page.drawText(patientData.dob, { x: coords.dob.x, y: height - coords.dob.yOffset, ...opts });
        if (patientData.nhsNumber) page.drawText(patientData.nhsNumber, { x: coords.nhs.x, y: height - coords.nhs.yOffset, ...opts });
        if (patientData.hospitalNumber) page.drawText(patientData.hospitalNumber, { x: coords.hospital.x, y: height - coords.hospital.yOffset, ...opts });
        if (patientData.consultant) page.drawText(patientData.consultant, { x: coords.consultant.x, y: height - coords.consultant.yOffset, ...opts });
      }
    }

    document.getElementById('consent-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      status.className = "mt-4 text-sm font-medium text-blue-600";
      status.innerText = "⏳ Downloading blank forms and filling patient details...";

      const patientData = {
        name: document.getElementById('patientName').value,
        dob: document.getElementById('dob').value,
        nhsNumber: document.getElementById('nhsNumber').value,
        hospitalNumber: document.getElementById('hospitalNumber').value,
        consultant: document.getElementById('consultant').value
      };

      const selected = Array.from(document.querySelectorAll('.treatment-checkbox:checked')).map(cb => cb.value);

      if (selected.length === 0) {
        status.className = "mt-4 text-sm font-medium text-red-600";
        status.innerText = "⚠️ Please select at least one treatment form.";
        return;
      }

      const zip = new JSZip();
      const safeName = patientData.name.replace(/\s+/g, '_');

      try {
        for (const code of selected) {
          const item = TREATMENTS[code];

          const pdfBytes = await fetchRemotePdf(item.templateUrl);
          const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);

          await fillPdf(pdfDoc, item, patientData);

          const filledPdfBytes = await pdfDoc.save();
          zip.file(`${safeName}_${item.name}_Consent.pdf`, filledPdfBytes);

          window.open(item.macmillanUrl, '_blank');
        }

        const zipBlob = await zip.generateAsync({ type: "blob" });
        saveAs(zipBlob, `${safeName}_Consent_Package.zip`);

        status.className = "mt-4 text-sm font-medium text-emerald-600";
        status.innerText = "✅ Complete! ZIP file downloaded & Macmillan leaflet tabs opened.";
      } catch (err) {
        status.className = "mt-4 text-sm font-medium text-red-600";
        status.innerText = `❌ Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
