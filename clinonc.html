<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Oncology: Clinic Guide</title>
    <style>
        :root {
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #0f172a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #0ea5e9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-nav {
            background-color: var(--primary);
            padding: 0 20px;
            display: flex;
            overflow-x: auto;
            border-bottom: 4px solid var(--accent);
        }

        .nav-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            padding: 15px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .nav-btn.active { color: #fff; border-bottom: 4px solid var(--accent); margin-bottom: -4px; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 220px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            overflow-y: auto;
        }

        .sub-nav-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 24px;
            background: none;
            border: none;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }

        .sub-nav-btn.active { background: #eff6ff; color: var(--accent); border-right: 3px solid var(--accent); }

        .content { flex: 1; padding: 30px; overflow-y: auto; }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 900px;
            margin: 0 auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; }
        select { padding: 10px; border: 1px solid var(--border); border-radius: 6px; outline: none; }

        .btn-calc {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        #results-container { margin-top: 25px; display: none; }
        .result-box { padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid; }
        .treatment-box { background: #f0fdf4; border-color: var(--success); }
        .followup-box { background: #f8fafc; border-color: var(--info); }
        
        .risk-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .disclaimer { font-size: 0.75rem; color: var(--text-muted); margin-top: 30px; text-align: center; border-top: 1px solid var(--border); padding-top: 15px; }
    </style>
</head>
<body>

    <div class="top-nav" id="topNav"></div>

    <div class="main-layout">
        <div class="sidebar" id="sideNav"></div>
        <div class="content">
            <div class="card">
                <h2 id="module-title">Select Module</h2>
                <p id="module-subtitle" style="color: var(--text-muted); margin-bottom: 20px;"></p>

                <div id="form-container" class="form-grid"></div>
                <button id="calc-btn" class="btn-calc" style="display:none" onclick="calculateLogic()">Calculate Pathway</button>

                <div id="results-container">
                    <div id="risk-badge" class="risk-badge"></div>
                    <div class="result-box treatment-box">
                        <h4 style="margin-bottom:8px">Management Recommendation</h4>
                        <p id="treatment-text"></p>
                    </div>
                    <div class="result-box followup-box">
                        <h4 style="margin-bottom:8px">Follow-up Protocol</h4>
                        <p id="followup-text"></p>
                    </div>
                </div>

                <div class="disclaimer">
                    <strong>Educational Prototype:</strong> Clinical judgment required. Discuss all cases at specialist MDT.
                </div>
            </div>
        </div>
    </div>

<script>
/**
 * 1. CLINICAL KNOWLEDGE BASE
 */
const clinicalData = {
    "CNS": { subsites: ["Glioma"] },
    "H&N": { subsites: ["Oropharynx"] },
    "Breast": { subsites: ["Early", "Locally Advanced"] },
    "Lung": { subsites: ["NSCLC", "SCLC"] },
    "UGI": { subsites: ["Oesophagus", "Pancreas"] },
    "LGI": { subsites: ["Colon", "Rectal", "Anal"] },
    "GU": { subsites: ["Prostate", "Bladder"] },
    "Gynae": { subsites: ["Endometrial"] }
};

const ToolRegistry = {
    "Colon": {
        subtitle: "Adjuvant (IDEA) & Neoadjuvant (FOXTRoT/ESMO)",
        inputs: [
            { id: "intent", label: "Clinical Setting", options: ["Adjuvant (Post-Op)", "Neoadjuvant (FOXTRoT Criteria)"] },
            { id: "tstage", label: "T-Stage", options: ["T1/T2", "T3 (Low Risk <5mm)", "T3 (High Risk >5mm)", "T4a", "T4b"] },
            { id: "nstage", label: "N-Stage", options: ["N0", "N1 (1-3 nodes)", "N2 (>=4 nodes)"] },
            { id: "nodes", label: "Nodes Removed", options: [">= 12", "< 12"] },
            { id: "mmr", label: "MMR Status", options: ["pMMR", "dMMR"] },
            { id: "risk_feat", label: "High Risk (EMVI/PNI/Grade 3)", options: ["None", "Present"] },
            { id: "ps", label: "Performance Status", options: ["PS 0-1", "PS 2", "PS 3+"] },
            { id: "age", label: "Age", options: ["< 70", "70-80", "> 80"] }
        ],
        logic: (v) => {
            if (v.intent === "Neoadjuvant (FOXTRoT Criteria)") {
                const fit = (v.tstage.includes("High Risk") || v.tstage.startsWith("T4")) && v.ps === "PS 0-1";
                return {
                    risk: fit ? "FOXTRoT Eligible" : "Ineligible",
                    color: fit ? "var(--success)" : "var(--warning)",
                    treatment: fit ? "<strong>Neoadjuvant Chemo:</strong> 6 weeks Oxaliplatin-based (CAPOX/FOLFOX) then surgery." : "Upfront surgery recommended. No trial-based benefit for neoadjuvant chemo in this profile.",
                    followup: "Re-stage post-op for adjuvant completion."
                };
            }
            // Adjuvant Logic
            if (v.ps.startsWith("PS 3") || v.age === "> 80") return { risk: "Frail/Elderly", color: "var(--warning)", treatment: "Observation or single-agent Capecitabine if fit.", followup: "Standard LGI surveillance." };
            
            if (v.nstage !== "N0") {
                return { risk: "Stage III", color: "var(--danger)", treatment: "<strong>3 months CAPOX (IDEA)</strong> or 6 months FOLFOX. Dual agent preferred.", followup: "CEA/CT surveillance." };
            }
            if (v.mmr === "dMMR") return { risk: "Stage II dMMR", color: "var(--success)", treatment: "<strong>Observation.</strong> High prognosis; minimal 5-FU benefit.", followup: "Standard surveillance." };
            
            const hiRisk = v.tstage.startsWith("T4") || v.nodes === "< 12" || v.risk_feat === "Present";
            return {
                risk: hiRisk ? "High-Risk Stage II" : "Low-Risk Stage II",
                color: hiRisk ? "var(--accent)" : "var(--success)",
                treatment: hiRisk ? "<strong>Capecitabine or 3m CAPOX.</strong>" : "Observation.",
                followup: "Standard surveillance."
            };
        }
    },
    "Prostate": {
        subtitle: "NICE/Cambridge Risk Stratification",
        inputs: [
            { id: "psa", label: "PSA Level", options: ["< 10", "10-20", "> 20"] },
            { id: "grade", label: "Grade Group", options: ["GG 1", "GG 2", "GG 3", "GG 4", "GG 5"] },
            { id: "t", label: "T-Stage", options: ["T1-T2a", "T2b", "T2c", "T3a", "T3b-T4"] }
        ],
        logic: (v) => { /* Simple prostate stub */
            const high = v.psa === "> 20" || v.grade === "GG 4" || v.t.startsWith("T3");
            return {
                risk: high ? "High Risk" : "Low/Intermediate",
                color: high ? "var(--danger)" : "var(--success)",
                treatment: high ? "Radical RT + 2-3 yrs ADT" : "AS or Radical RT",
                followup: "PSA monitoring"
            };
        }
    }
};

/**
 * 2. UI ENGINE
 */
let currentSystem = "LGI";
let currentSubsite = "Colon";

function init() {
    renderTopNav();
    loadSystem(currentSystem);
}

function renderTopNav() {
    const nav = document.getElementById('topNav');
    nav.innerHTML = '';
    ["CNS", "H&N", "Breast", "Lung", "UGI", "LGI", "GU", "Gynae"].forEach(sys => {
        const btn = document.createElement('button');
        btn.className = `nav-btn ${sys === currentSystem ? 'active' : ''}`;
        btn.innerText = sys;
        btn.onclick = () => loadSystem(sys);
        nav.appendChild(btn);
    });
}

function loadSystem(sys) {
    currentSystem = sys;
    renderTopNav();
    const sideNav = document.getElementById('sideNav');
    sideNav.innerHTML = '';
    clinicalData[sys].subsites.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = `sub-nav-btn ${sub === currentSubsite ? 'active' : ''}`;
        btn.innerText = sub;
        btn.onclick = () => loadSubsite(sub);
        sideNav.appendChild(btn);
    });
    loadSubsite(clinicalData[sys].subsites[0]);
}

function loadSubsite(sub) {
    currentSubsite = sub;
    document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.toggle('active', b.innerText === sub));
    const tool = ToolRegistry[sub] || { subtitle: "Module under construction", inputs: [] };
    
    document.getElementById('module-title').innerText = `${sub} Cancer`;
    document.getElementById('module-subtitle').innerText = tool.subtitle;
    document.getElementById('form-container').innerHTML = tool.inputs.map(i => `
        <div class="input-group">
            <label>${i.label}</label>
            <select id="input-${i.id}">${i.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>
        </div>
    `).join('') || `<p style="padding:20px; color:var(--text-muted)">Tool in development.</p>`;

    document.getElementById('calc-btn').style.display = tool.inputs.length ? 'block' : 'none';
    document.getElementById('results-container').style.display = 'none';
}

function calculateLogic() {
    const tool = ToolRegistry[currentSubsite];
    const vals = {};
    tool.inputs.forEach(i => vals[i.id] = document.getElementById(`input-${i.id}`).value);
    const res = tool.logic(vals);
    
    document.getElementById('risk-badge').innerText = res.risk;
    document.getElementById('risk-badge').style.backgroundColor = res.color;
    document.getElementById('treatment-text').innerHTML = res.treatment;
    document.getElementById('followup-text').innerHTML = res.followup;
    document.getElementById('results-container').style.display = 'block';
}

window.onload = init;
</script>
</body>
</html>
