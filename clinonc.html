<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Oncology: Clinic Guide</title>
    <style>
        :root {
            --bg-main: #f0f2f5; --bg-card: #ffffff; --text-main: #1e293b;
            --text-muted: #64748b; --primary: #0f172a; --accent: #3b82f6;
            --accent-hover: #2563eb; --border: #e2e8f0; --success: #10b981;
            --warning: #f59e0b; --danger: #ef4444; --info: #0ea5e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
        .top-nav { background: var(--primary); padding: 0 20px; display: flex; overflow-x: auto; border-bottom: 4px solid var(--accent); }
        .nav-btn { background: none; border: none; color: #cbd5e1; padding: 15px 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .nav-btn.active { color: #fff; border-bottom: 4px solid var(--accent); margin-bottom: -4px; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 220px; background: var(--bg-card); border-right: 1px solid var(--border); padding: 20px 0; overflow-y: auto; }
        .sub-nav-btn { display: block; width: 100%; text-align: left; padding: 12px 24px; background: none; border: none; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
        .sub-nav-btn.active { background: #eff6ff; color: var(--accent); border-right: 3px solid var(--accent); font-weight: bold; }
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 950px; margin: 0 auto; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin: 20px 0; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.7rem; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; }
        select, input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
        .btn-calc { width: 100%; padding: 15px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #results-container { margin-top: 25px; display: none; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .result-box { padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid; }
        .treatment-box { background: #f0fdf4; border-color: var(--success); }
        .timeline-box { background: #f8fafc; border-color: var(--info); }
        .schedule-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .schedule-table th { text-align: left; padding: 8px; border-bottom: 2px solid var(--border); color: var(--text-muted); }
        .schedule-table td { padding: 8px; border-bottom: 1px solid var(--border); }
        .risk-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .disclaimer { font-size: 0.7rem; color: var(--text-muted); margin-top: 30px; text-align: center; border-top: 1px solid var(--border); padding-top: 15px; }
    </style>
</head>
<body>

    <div class="top-nav" id="topNav"></div>
    <div class="main-layout">
        <div class="sidebar" id="sideNav"></div>
        <div class="content">
            <div class="card">
                <h2 id="module-title">Select Module</h2>
                <p id="module-subtitle" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;"></p>
                <div id="form-container" class="form-grid"></div>
                <button id="calc-btn" class="btn-calc" style="display:none" onclick="calculateLogic()">Generate Plan & Schedule</button>
                <div id="results-container">
                    <div id="risk-badge" class="risk-badge"></div>
                    <div class="result-box treatment-box">
                        <h4 style="margin-bottom:8px">Clinical Recommendation</h4>
                        <p id="treatment-text"></p>
                    </div>
                    <div class="result-box timeline-box">
                        <h4 style="margin-bottom:8px">Pathway Timeline</h4>
                        <div id="timeline-output"></div>
                    </div>
                </div>
                <div class="disclaimer"><strong>Educational Prototype:</strong> Based on FOXTRoT and IDEA trial protocols. Clinical judgment required.</div>
            </div>
        </div>
    </div>

<script>
const clinicalData = {
    "CNS": { subsites: ["Glioma"] }, "H&N": { subsites: ["Oropharynx"] }, "Breast": { subsites: ["Early", "Locally Advanced"] },
    "Lung": { subsites: ["NSCLC", "SCLC"] }, "UGI": { subsites: ["Oesophagus", "Pancreas"] },
    "LGI": { subsites: ["Colon Neoadjuvant", "Colon Adjuvant", "Rectal", "Anal"] },
    "GU": { subsites: ["Prostate", "Bladder"] }, "Gynae": { subsites: ["Endometrial"] }
};

const ToolRegistry = {
    "Colon Neoadjuvant": {
        subtitle: "FOXTRoT Protocol (6 weeks NAC)",
        inputs: [
            { id: "startDate", label: "Chemotherapy Start Date", type: "date" },
            { id: "tstage", label: "T-Stage", options: ["T3 (High Risk >5mm)", "T4a", "T4b", "T1-T3 Low Risk"] },
            { id: "ps", label: "Performance Status", options: ["PS 0-1", "PS 2+"] }
        ],
        logic: (v) => {
            const fit = v.tstage !== "T1-T3 Low Risk" && v.ps === "PS 0-1";
            const res = {
                risk: fit ? "FOXTRoT Eligible" : "Surgery First",
                color: fit ? "var(--success)" : "var(--warning)",
                treatment: fit ? "<strong>Standard FOXTRoT:</strong> 6 weeks (3x CAPOX or 4x FOLFOX) followed by surgery." : "Upfront surgery recommended. No trial benefit for neoadjuvant chemotherapy in this profile.",
                timeline: []
            };

            if (fit && v.startDate) {
                const start = new Date(v.startDate);
                res.timeline = [
                    { event: "Cycle 1 Start", date: formatDate(start) },
                    { event: "Cycle 2 Start", date: formatDate(addDays(start, 21)) },
                    { event: "Restaging CT CAP", date: formatDate(addDays(start, 42)) },
                    { event: "Post-NAC MDT Discussion", date: formatDate(addDays(start, 49)) },
                    { event: "Clinic Outcome Meeting", date: formatDate(addDays(start, 53)) },
                    { event: "Week of Surgery", date: formatDate(addDays(start, 70)) + " (approx)" }
                ];
            }
            return res;
        }
    },
    "Colon Adjuvant": {
        subtitle: "IDEA Protocol / ESMO Guidelines",
        inputs: [
            { id: "surgeryDate", label: "Date of Surgery", type: "date" },
            { id: "nstage", label: "N-Stage", options: ["N0", "N1 (1-3 nodes)", "N2 (>=4 nodes)"] },
            { id: "tstage", label: "T-Stage", options: ["T1-T2", "T3", "T4"] },
            { id: "mmr", label: "MMR Status", options: ["pMMR", "dMMR"] },
            { id: "duration", label: "Planned Duration", options: ["3 Months (CAPOX)", "6 Months (FOLFOX/CAPOX)"] }
        ],
        logic: (v) => {
            const isStage3 = v.nstage !== "N0";
            const res = {
                risk: isStage3 ? "Stage III" : "Stage II",
                color: isStage3 ? "var(--danger)" : "var(--success)",
                treatment: isStage3 ? `Adjuvant chemotherapy indicated (${v.duration}).` : "Risk-stratified approach (consider dMMR and T4 status).",
                timeline: []
            };

            if (v.surgeryDate) {
                const surg = new Date(v.surgeryDate);
                const chemoStart = addDays(surg, 42); // 6 weeks post-op
                const endWeeks = v.duration.includes("3") ? 12 : 24;
                
                res.timeline = [
                    { event: "Proposed Chemo Start", date: formatDate(chemoStart) },
                    { event: "Completion of Chemotherapy", date: formatDate(addDays(chemoStart, endWeeks * 7)) },
                    { event: "End of Treatment CT Scan", date: formatDate(addDays(chemoStart, (endWeeks + 4) * 7)) },
                    { event: "1st Surveillance CEA", date: formatDate(addDays(surg, 180)) },
                    { event: "1-Year CT CAP & Colonoscopy", date: formatDate(addDays(surg, 365)) },
                    { event: "2-Year CT & CEA", date: formatDate(addDays(surg, 730)) },
                    { event: "3-Year CT & CEA", date: formatDate(addDays(surg, 1095)) }
                ];
            }
            return res;
        }
    }
};

/** HELPER FUNCTIONS **/
function addDays(date, days) { const result = new Date(date); result.setDate(result.getDate() + days); return result; }
function formatDate(date) { return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }

/** UI ENGINE **/
let currentSystem = "LGI";
let currentSubsite = "Colon Neoadjuvant";

function init() { renderTopNav(); loadSystem(currentSystem); }

function renderTopNav() {
    const nav = document.getElementById('topNav'); nav.innerHTML = '';
    ["CNS", "H&N", "Breast", "Lung", "UGI", "LGI", "GU", "Gynae"].forEach(sys => {
        const btn = document.createElement('button'); btn.className = `nav-btn ${sys === currentSystem ? 'active' : ''}`;
        btn.innerText = sys; btn.onclick = () => loadSystem(sys); nav.appendChild(btn);
    });
}

function loadSystem(sys) {
    currentSystem = sys; renderTopNav();
    const sideNav = document.getElementById('sideNav'); sideNav.innerHTML = '';
    clinicalData[sys].subsites.forEach(sub => {
        const btn = document.createElement('button'); btn.className = `sub-nav-btn ${sub === currentSubsite ? 'active' : ''}`;
        btn.innerText = sub; btn.onclick = () => loadSubsite(sub); sideNav.appendChild(btn);
    });
    loadSubsite(currentSubsite);
}

function loadSubsite(sub) {
    currentSubsite = sub;
    document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.toggle('active', b.innerText === sub));
    const tool = ToolRegistry[sub] || { subtitle: "In development", inputs: [] };
    document.getElementById('module-title').innerText = sub;
    document.getElementById('module-subtitle').innerText = tool.subtitle;
    
    document.getElementById('form-container').innerHTML = tool.inputs.map(i => `
        <div class="input-group">
            <label>${i.label}</label>
            ${i.type === 'date' ? `<input type="date" id="input-${i.id}">` : 
            `<select id="input-${i.id}">${i.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`}
        </div>
    `).join('');
    document.getElementById('calc-btn').style.display = tool.inputs.length ? 'block' : 'none';
    document.getElementById('results-container').style.display = 'none';
}

function calculateLogic() {
    const tool = ToolRegistry[currentSubsite];
    const vals = {};
    tool.inputs.forEach(i => vals[i.id] = document.getElementById(`input-${i.id}`).value);
    const res = tool.logic(vals);
    
    document.getElementById('risk-badge').innerText = res.risk;
    document.getElementById('risk-badge').style.backgroundColor = res.color;
    document.getElementById('treatment-text').innerHTML = res.treatment;
    
    let html = `<table class="schedule-table"><thead><tr><th>Milestone</th><th>Target Date</th></tr></thead><tbody>`;
    res.timeline.forEach(t => html += `<tr><td>${t.event}</td><td><strong>${t.date}</strong></td></tr>`);
    html += `</tbody></table>`;
    
    document.getElementById('timeline-output').innerHTML = res.timeline.length ? html : "Input a date above to generate schedule.";
    document.getElementById('results-container').style.display = 'block';
}
window.onload = init;
</script>
</body>
</html>
