<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oncology Adjuvant & Follow-up Master Tool</title>
    <style>
        :root {
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #0f172a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #0ea5e9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Navigation */
        .top-nav {
            background-color: var(--primary);
            padding: 0 20px;
            display: flex;
            overflow-x: auto;
            border-bottom: 4px solid var(--accent);
        }

        .nav-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s, background 0.2s;
        }

        .nav-btn:hover { color: #fff; background-color: rgba(255,255,255,0.1); }
        .nav-btn.active { color: #fff; border-bottom: 4px solid var(--accent); margin-bottom: -4px; }

        /* Main Layout */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Sub-navigation */
        .sidebar {
            width: 250px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            overflow-y: auto;
        }

        .sub-nav-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 24px;
            background: none;
            border: none;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .sub-nav-btn:hover { background-color: var(--bg-main); color: var(--primary); }
        .sub-nav-btn.active { background-color: #eff6ff; color: var(--accent); border-right: 3px solid var(--accent); }

        /* Content Area */
        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            max-width: 800px;
            margin: 0 auto;
        }

        h2 { font-size: 1.5rem; margin-bottom: 8px; color: var(--primary); }
        .subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .input-group { display: flex; flex-direction: column; }
        
        label { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            background-color: #fff;
        }
        select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .btn-calc {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-calc:hover { background-color: var(--accent-hover); }

        /* Results Area */
        #results-container {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-box {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid;
        }

        .result-box h3 { margin-bottom: 10px; font-size: 1.1rem; }
        .result-box p { line-height: 1.5; }

        .treatment-box { background-color: #f0fdf4; border-color: var(--success); }
        .treatment-box h3 { color: #166534; }
        
        .followup-box { background-color: #eff6ff; border-color: var(--info); }
        .followup-box h3 { color: #1e40af; }

        .risk-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
        }

        .disclaimer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .placeholder-msg {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="top-nav" id="topNav"></div>

    <div class="main-layout">
        <div class="sidebar" id="sideNav"></div>

        <div class="content">
            <div class="card">
                <div id="module-header">
                    <h2 id="module-title">Select a Module</h2>
                    <p class="subtitle" id="module-subtitle">Choose a system from the navigation above.</p>
                </div>

                <div id="form-container" class="form-grid"></div>
                <button id="calc-btn" class="btn-calc" style="display: none;" onclick="calculateLogic()">Calculate Pathway & Follow-up</button>

                <div id="results-container">
                    <div id="risk-badge" class="risk-badge"></div>
                    <div class="result-box treatment-box">
                        <h3>Treatment Recommendation</h3>
                        <p id="treatment-text"></p>
                    </div>
                    <div class="result-box followup-box">
                        <h3>Follow-up Protocol</h3>
                        <p id="followup-text"></p>
                    </div>
                </div>

                <div class="disclaimer">
                    <strong>Disclaimer:</strong> This tool is an educational prototype for Clinical Oncology Registrars. It does not replace clinical judgment. All cases must be discussed at a specialist MDT.
                </div>
            </div>
        </div>
    </div>

<script>
/**
 * ---------------------------------------------------------
 * THE MASTER CLINICAL DATABASE
 * You can expand this JSON object to build out the whole app.
 * ---------------------------------------------------------
 */
const clinicalData = {
    "GU": {
        subsites: {
            "Prostate": {
                subtitle: "Risk Stratification & Pathway (NICE/Cambridge)",
                inputs: [
                    { id: "psa", label: "PSA Level", options: ["< 10", "10 - 20", "> 20"] },
                    { id: "grade", label: "Grade Group (Gleason)", options: ["GG 1 (<=6)", "GG 2 (3+4=7)", "GG 3 (4+3=7)", "GG 4 (8)", "GG 5 (9-10)"] },
                    { id: "tstage", label: "T-Stage (MRI/DRE)", options: ["T1 - T2a", "T2b", "T2c", "T3a", "T3b - T4", "N1"] }
                ],
                logic: (inputs) => {
                    const { psa, grade, tstage } = inputs;
                    let risk, treatment, followup, color;

                    if (tstage === "N1" || tstage === "T3b - T4" || tstage === "T3a" || tstage === "T2c" || grade.startsWith("GG 4") || grade.startsWith("GG 5") || psa === "> 20") {
                        risk = "High Risk / Locally Advanced";
                        color = "var(--danger)";
                        treatment = "<strong>Radical RT (e.g. 60Gy/20# or 74Gy/37#) + 2-3 years ADT.</strong> Consider pelvic nodal irradiation if risk >15%. Alternatively, Radical Prostatectomy. If high burden, consider systemic escalation (Docetaxel/Abiraterone).";
                        followup = "PSA at 6 weeks post-RT, then 3-6 monthly for 3 years, then 6-12 monthly. Monitor bone health (DEXA) due to long-term ADT.";
                    } else if (psa === "10 - 20" || grade.startsWith("GG 2") || grade.startsWith("GG 3") || tstage === "T2b") {
                        risk = "Intermediate Risk";
                        color = "var(--warning)";
                        treatment = "<strong>Radical RT + 4-6 months ADT.</strong> Consider LDR or HDR Brachytherapy as monotherapy (if favorable) or boost. Alternatively, Radical Prostatectomy or Active Surveillance (if favorable/low volume).";
                        followup = "PSA 3-6 monthly for 3 years, then annually. Monitor urinary and bowel function.";
                    } else {
                        risk = "Low Risk";
                        color = "var(--success)";
                        treatment = "<strong>Active Surveillance</strong> is the standard of care. Intervene only if disease progression (PSA kinetics, MRI changes, or repeat biopsy). Alternatives: LDR Brachytherapy or RP.";
                        followup = "PSA every 3-4 months in year 1, then 6-monthly. DRE annually. Repeat MRI/Biopsy protocol per local MDT.";
                    }
                    return { risk, color, treatment, followup };
                }
            },
            "Bladder": { subtitle: "Module under construction", inputs: [], logic: () => ({}) }
        }
    },
    "LGI": {
        subsites: {
            "Anal": {
                subtitle: "Definitive Chemoradiotherapy (PLATO/ACT II)",
                inputs: [
                    { id: "tstage", label: "T-Stage", options: ["T1", "T2", "T3", "T4"] },
                    { id: "nstage", label: "N-Stage", options: ["N0", "N1a", "N1b", "N1c"] }
                ],
                logic: (inputs) => {
                    const t = inputs.tstage; const n = inputs.nstage;
                    let risk = (n !== "N0" || t === "T3" || t === "T4") ? "High Risk (Locally Advanced)" : "Low Risk (Early Stage)";
                    return {
                        risk: risk,
                        color: risk.includes("High") ? "var(--danger)" : "var(--success)",
                        treatment: risk.includes("High") ? "<strong>53.2Gy in 28 fractions</strong>. Concurrent Mitomycin C (Day 1) and 5-FU/Capecitabine." : "<strong>50.4Gy in 28 fractions</strong>. Concurrent Mitomycin C (Day 1) and 5-FU/Capecitabine.",
                        followup: risk.includes("High") ? "12-Week Assessment: DRE + MRI Pelvis. If CR, review 3-6 monthly for 2 years. Annual CT CAP for 3 years." : "12-Week Assessment: DRE + MRI Pelvis. If CR, review 3-6 monthly for 2 years. Routine cross-sectional imaging not strictly required."
                    };
                }
            },
            "Rectal": {
                subtitle: "Neoadjuvant Strategy & Organ Preservation",
                inputs: [
                    { id: "tstage", label: "T-Stage", options: ["T1", "T2", "T3", "T4"] },
                    { id: "crm", label: "CRM / EMVI", options: ["Clear & Neg", "Threatened CRM", "EMVI Positive"] }
                ],
                logic: (inputs) => {
                    const { tstage, crm } = inputs;
                    if (tstage === "T1" && crm === "Clear & Neg") {
                        return { risk: "Early Disease", color: "var(--success)", treatment: "Consider Organ Preservation: Local excision (TEMS/TAMIS) or Papillon (Contact X-ray Brachytherapy) if patient refuses surgery.", followup: "If Watch & Wait: Intensive protocol. MRI and Endoscopy every 3 months for first 2 years, then 6 monthly to 5 years." };
                    } else if (tstage === "T4" || crm !== "Clear & Neg") {
                        return { risk: "High Risk (Threatened Margins)", color: "var(--danger)", treatment: "<strong>Total Neoadjuvant Therapy (TNT)</strong>. Consider SCRT (5x5Gy) followed by consolidation chemo (RAPIDO), or Neoadjuvant chemo followed by Long-Course ChemoRT (PRODIGE 23).", followup: "Standard post-op LGI: CT CAP at 1 and 3 years. CEA 6-monthly for 3 years. Colonoscopy at 1 and 5 years." };
                    } else {
                        return { risk: "Intermediate", color: "var(--warning)", treatment: "Upfront TME Surgery OR Short-Course RT (25Gy/5#) with immediate surgery.", followup: "Standard post-op LGI surveillance." };
                    }
                }
            }
        }
    },
    "Gynae": {
        subsites: {
            "Endometrial": {
                subtitle: "Adjuvant Therapy (ESGO 2025 Integrated)",
                inputs: [
                    { id: "risk", label: "ESGO Risk Group", options: ["Low", "Intermediate", "High-Intermediate", "High"] }
                ],
                logic: (inputs) => {
                    const map = {
                        "Low": { c: "var(--success)", t: "<strong>Observation.</strong> No adjuvant treatment.", f: "Patient-Initiated Follow-Up (PIFU)." },
                        "Intermediate": { c: "var(--accent)", t: "<strong>Vaginal Brachytherapy (VBT)</strong> to reduce vault recurrence.", f: "PIFU or routine clinical review per local policy." },
                        "High-Intermediate": { c: "var(--warning)", t: "<strong>EBRT</strong> +/- Vaginal Brachytherapy boost.", f: "3-4 monthly clinics for 2 years, then 6 monthly to 5 years." },
                        "High": { c: "var(--danger)", t: "<strong>Chemotherapy + EBRT.</strong> Sequence per MDT (Sandwich or sequential).", f: "3 monthly clinics for 2 years, then 6 monthly to 5 years. Symptom-directed imaging." }
                    };
                    const res = map[inputs.risk];
                    return { risk: inputs.risk + " Risk", color: res.c, treatment: res.t, followup: res.f };
                }
            }
        }
    },
    // Placeholders for architecture scaling
    "Breast": { subsites: { "Early": { inputs: [], logic: ()=>({}) }, "Locally Advanced": { inputs: [], logic: ()=>({}) } } },
    "Lung": { subsites: { "NSCLC": { inputs: [], logic: ()=>({}) }, "SCLC": { inputs: [], logic: ()=>({}) } } },
    "CNS": { subsites: { "Glioma": { inputs: [], logic: ()=>({}) } } },
    "H&N": { subsites: { "Oropharynx": { inputs: [], logic: ()=>({}) } } },
    "UGI": { subsites: { "Oesophagus": { inputs: [], logic: ()=>({}) }, "Pancreas": { inputs: [], logic: ()=>({}) } } }
};

let currentSystem = "GU";
let currentSubsite = "Prostate";

/**
 * ---------------------------------------------------------
 * UI RENDER ENGINE
 * ---------------------------------------------------------
 */
function init() {
    renderTopNav();
    loadSystem(currentSystem);
}

function renderTopNav() {
    const nav = document.getElementById('topNav');
    nav.innerHTML = '';
    Object.keys(clinicalData).forEach(sys => {
        const btn = document.createElement('button');
        btn.className = `nav-btn ${sys === currentSystem ? 'active' : ''}`;
        btn.innerText = sys;
        btn.onclick = () => loadSystem(sys);
        nav.appendChild(btn);
    });
}

function loadSystem(sys) {
    currentSystem = sys;
    renderTopNav();
    
    const sideNav = document.getElementById('sideNav');
    sideNav.innerHTML = '';
    
    const subsites = Object.keys(clinicalData[sys].subsites);
    if(subsites.length > 0) {
        currentSubsite = subsites[0]; // Auto-select first
        subsites.forEach(sub => {
            const btn = document.createElement('button');
            btn.className = `sub-nav-btn ${sub === currentSubsite ? 'active' : ''}`;
            btn.innerText = sub;
            btn.onclick = () => loadSubsite(sub);
            sideNav.appendChild(btn);
        });
        loadSubsite(currentSubsite);
    }
}

function loadSubsite(sub) {
    currentSubsite = sub;
    
    // Update sidebar UI
    document.querySelectorAll('.sub-nav-btn').forEach(b => {
        b.classList.toggle('active', b.innerText === sub);
    });

    const data = clinicalData[currentSystem].subsites[sub];
    
    document.getElementById('module-title').innerText = `${sub} Cancer`;
    document.getElementById('module-subtitle').innerText = data.subtitle || "";
    
    const container = document.getElementById('form-container');
    const calcBtn = document.getElementById('calc-btn');
    const results = document.getElementById('results-container');
    
    container.innerHTML = '';
    results.style.display = 'none';

    if (!data.inputs || data.inputs.length === 0) {
        container.innerHTML = `<div class="placeholder-msg">Module currently in development. Clinical logic pending.</div>`;
        calcBtn.style.display = 'none';
        return;
    }

    // Generate Form
    data.inputs.forEach(inp => {
        const group = document.createElement('div');
        group.className = 'input-group';
        
        const label = document.createElement('label');
        label.innerText = inp.label;
        
        const select = document.createElement('select');
        select.id = `input-${inp.id}`;
        
        inp.options.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.innerText = opt;
            select.appendChild(option);
        });

        group.appendChild(label);
        group.appendChild(select);
        container.appendChild(group);
    });

    calcBtn.style.display = 'block';
}

function calculateLogic() {
    const data = clinicalData[currentSystem].subsites[currentSubsite];
    if (!data.logic) return;

    // Gather inputs
    const userInputs = {};
    data.inputs.forEach(inp => {
        userInputs[inp.id] = document.getElementById(`input-${inp.id}`).value;
    });

    // Run Engine
    const result = data.logic(userInputs);

    // Render Output
    const resDiv = document.getElementById('results-container');
    document.getElementById('risk-badge').innerText = result.risk;
    document.getElementById('risk-badge').style.backgroundColor = result.color;
    document.getElementById('treatment-text').innerHTML = result.treatment;
    document.getElementById('followup-text').innerHTML = result.followup;
    
    resDiv.style.display = 'block';
}

// Boot up
window.onload = init;

</script>
</body>
</html>
