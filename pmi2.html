<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OncoStream Pro | Billing & Clinical Letters</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        @media print { 
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
        }
        .letter-paper { min-height: 297mm; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900" x-data="oncoApp()" x-init="init()">

    <nav class="bg-indigo-950 text-white p-4 no-print shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tight text-indigo-400">ONCO<span class="text-white">STREAM</span> <span class="text-xs bg-indigo-500 text-white px-2 py-0.5 rounded ml-2">v2.5 PRO</span></h1>
            <div class="flex gap-6 text-sm items-center">
                <button @click="view = 'billing'" :class="view === 'billing' ? 'text-white border-b-2 border-indigo-400' : 'text-slate-400'">Billing Dashboard</button>
                <button @click="view = 'letters'" :class="view === 'letters' ? 'text-white border-b-2 border-indigo-400' : 'text-slate-400'">Letter Drafts</button>
                <div class="h-6 w-px bg-slate-700"></div>
                <button @click="clearData()" class="text-red-400 text-xs hover:underline">Reset Session</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 no-print" x-show="view === 'billing'">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <aside class="space-y-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Total Net Income</p>
                    <h2 class="text-3xl font-black text-emerald-600" x-text="'£' + totals.net.toLocaleString()"></h2>
                    <div class="mt-4 pt-4 border-t border-slate-100 space-y-2 text-sm">
                        <div class="flex justify-between text-slate-500"><span>Gross:</span><span x-text="'£' + totals.gross"></span></div>
                        <div class="flex justify-between text-slate-500"><span>Expenses:</span><span x-text="'£' + totals.expenses"></span></div>
                    </div>
                </div>
                
                <div class="bg-indigo-900 text-white p-6 rounded-2xl shadow-lg">
                    <h3 class="text-sm font-bold text-indigo-300 uppercase mb-4">Practice Overheads</h3>
                    <div class="space-y-3">
                        <label class="block text-[10px] font-bold uppercase text-indigo-400">Monthly Room Hire (£)</label>
                        <input type="number" x-model.number="settings.overheads" class="w-full bg-indigo-800 border-none rounded p-2 text-sm">
                        <label class="block text-[10px] font-bold uppercase text-indigo-400">Tax Provision (%)</label>
                        <input type="number" x-model.number="settings.tax" class="w-full bg-indigo-800 border-none rounded p-2 text-sm">
                    </div>
                </div>
            </aside>

            <main class="lg:col-span-3">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                        <h2 class="font-bold text-lg">Daily Clinical Activity</h2>
                        <button @click="addPatient()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg hover:bg-indigo-700 transition">+ Log New Patient</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] font-bold text-slate-500 uppercase">
                                <tr>
                                    <th class="p-4">Patient Reference</th>
                                    <th class="p-4">Insurer</th>
                                    <th class="p-4">CCSD Codes</th>
                                    <th class="p-4 text-right">Fee</th>
                                    <th class="p-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                <template x-for="(p, index) in patients" :key="index">
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-4">
                                            <input type="text" x-model="p.name" class="font-bold bg-transparent outline-none w-full border-b border-transparent focus:border-indigo-400" placeholder="e.g. HN12345">
                                        </td>
                                        <td class="p-4 text-sm">
                                            <select x-model="p.insurer" class="bg-transparent font-medium text-indigo-600">
                                                <template x-for="name in Object.keys(feeSchedule)" :key="name">
                                                    <option :value="name" x-text="name"></option>
                                                </template>
                                            </select>
                                        </td>
                                        <td class="p-4">
                                            <div class="flex gap-1">
                                                <template x-for="code in p.codes">
                                                    <span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded" x-text="code"></span>
                                                </template>
                                                <button @click="addCode(index)" class="text-indigo-400 hover:text-indigo-600 font-bold px-1">+</button>
                                            </div>
                                        </td>
                                        <td class="p-4 text-right font-mono font-bold" x-text="'£' + calculatePatientFee(p)"></td>
                                        <td class="p-4 flex gap-2">
                                            <button @click="editLetter(index)" class="bg-emerald-50 text-emerald-600 p-2 rounded-lg hover:bg-emerald-100" title="Draft GP Letter">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                            </button>
                                            <button @click="removePatient(index)" class="text-slate-300 hover:text-red-500 p-2">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-6 no-print" x-show="view === 'letters'" x-cloak>
        <div class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <h2 class="font-bold">GP Correspondence Draft</h2>
                <div class="flex gap-2">
                    <button @click="view = 'billing'" class="text-xs bg-slate-800 px-3 py-1 rounded">Back to Dashboard</button>
                    <button @click="window.print()" class="text-xs bg-emerald-600 px-3 py-1 rounded font-bold">Print Professional Letter</button>
                </div>
            </div>
            
            <div class="p-8 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase">Consultant Name</label>
                        <input type="text" x-model="settings.consultantName" class="w-full p-2 border-b font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase">Hospital/Clinic</label>
                        <input type="text" x-model="settings.clinicName" class="w-full p-2 border-b">
                    </div>
                </div>

                <div class="bg-slate-50 p-6 rounded-xl space-y-4">
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-xs font-bold mb-1">Diagnosis/Indication</label>
                            <input type="text" x-model="activeLetter.diagnosis" class="w-full p-2 border rounded" placeholder="e.g. Metastatic Prostate Adenocarcinoma">
                        </div>
                        <div class="w-32">
                            <label class="block text-xs font-bold mb-1">Performance Status</label>
                            <select x-model="activeLetter.ps" class="w-full p-2 border rounded">
                                <option>WHO 0</option><option>WHO 1</option><option>WHO 2</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold mb-1">Clinical Summary & Plan</label>
                        <textarea x-model="activeLetter.plan" rows="10" class="w-full p-4 border rounded font-serif text-lg leading-relaxed" placeholder="Type clinical notes here..."></textarea>
                    </div>

                    <div class="flex gap-2">
                        <span class="text-xs font-bold text-slate-400 uppercase pt-1">Smart phrases:</span>
                        <button @click="addPhrase('Stable on surveillance.')" class="bg-white border px-2 py-1 rounded text-xs hover:bg-slate-100">Surveillance</button>
                        <button @click="addPhrase('Proceeding to palliative radiotherapy.')" class="bg-white border px-2 py-1 rounded text-xs hover:bg-slate-100">Palliative Rads</button>
                        <button @click="addPhrase('Discussed side effects including fatigue and skin reaction.')" class="bg-white border px-2 py-1 rounded text-xs hover:bg-slate-100">Toxicity Discussion</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="hidden print-only p-12 bg-white text-slate-900 font-serif leading-relaxed text-lg letter-paper">
        <div class="text-right mb-12">
            <h2 class="text-xl font-bold uppercase" x-text="settings.consultantName"></h2>
            <p x-text="settings.clinicName"></p>
            <p x-text="new Date().toLocaleDateString('en-GB')"></p>
        </div>

        <div class="mb-8">
            <p><strong>RE:</strong> <span x-text="activeLetter.patientName"></span></p>
            <p><strong>Diagnosis:</strong> <span x-text="activeLetter.diagnosis"></span></p>
            <p><strong>Status:</strong> <span x-text="activeLetter.ps"></span></p>
        </div>

        <div class="whitespace-pre-wrap mb-12" x-text="activeLetter.plan"></div>

        <div class="mt-20">
            <p>Yours sincerely,</p>
            <div class="h-16"></div>
            <p class="font-bold text-xl font-sans uppercase tracking-widest border-t border-slate-200 pt-2 inline-block" x-text="settings.consultantName"></p>
            <p class="text-sm font-sans text-slate-500">Consultant Clinical Oncologist</p>
        </div>
    </div>

    <script>
        function oncoApp() {
            return {
                view: 'billing',
                settings: {
                    overheads: 1500,
                    tax: 25,
                    consultantName: 'Dr. Your Name',
                    clinicName: 'The Harley Street Clinic, London'
                },
                patients: [],
                activeLetter: { patientName: '', diagnosis: '', ps: 'WHO 0', plan: '' },
                
                feeSchedule: {
                    'Bupa': { '20300': 200, '20310': 150, 'X0001': 137, 'X0002': 257 },
                    'AXA Health': { '20300': 200, '20310': 150, 'X0001': 125, 'X0002': 250 },
                    'Self-Pay': { '20300': 250, '20310': 180, 'X0001': 200 }
                },

                init() {
                    const saved = localStorage.getItem('oncoData');
                    if(saved) {
                        const data = JSON.parse(saved);
                        this.patients = data.patients || [];
                        this.settings = data.settings || this.settings;
                    }
                    this.$watch('patients', val => this.save());
                    this.$watch('settings', val => this.save());
                },

                save() {
                    localStorage.setItem('oncoData', JSON.stringify({
                        patients: this.patients,
                        settings: this.settings
                    }));
                },

                addPatient() {
                    this.patients.unshift({ name: '', insurer: 'Bupa', codes: ['20300'], letter: { diagnosis: '', plan: '', ps: 'WHO 0' } });
                },

                addCode(index) {
                    const code = prompt("Enter CCSD Code:");
                    if(code) this.patients[index].codes.push(code);
                },

                removePatient(index) {
                    if(confirm("Delete this entry?")) this.patients.splice(index, 1);
                },

                calculatePatientFee(p) {
                    return p.codes.reduce((sum, c) => sum + (this.feeSchedule[p.insurer][c] || 0), 0);
                },

                editLetter(index) {
                    const p = this.patients[index];
                    this.activeLetter = {
                        patientName: p.name,
                        diagnosis: p.letter.diagnosis,
                        ps: p.letter.ps,
                        plan: p.letter.plan,
                        index: index
                    };
                    this.view = 'letters';
                },

                addPhrase(text) {
                    this.activeLetter.plan += " " + text;
                },

                clearData() {
                    if(confirm("Wipe all data?")) {
                        localStorage.clear();
                        window.location.reload();
                    }
                },

                get totals() {
                    let gross = this.patients.reduce((sum, p) => sum + this.calculatePatientFee(p), 0);
                    let taxable = Math.max(0, gross - this.settings.overheads);
                    return {
                        gross: gross,
                        expenses: this.settings.overheads,
                        net: taxable - (taxable * (this.settings.tax / 100))
                    };
                }
            }
        }
    </script>
</body>
</html>
