<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuro-Oncology Literature Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1A1410;
    --cream: #F5F0E8;
    --cream-dark: #EDE8DF;
    --cream-mid: #E8E2D8;
    --muted: #7A7268;
    --rule: #D4CEC4;
    --tab-accent: #2D4A7A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Source Serif 4', Georgia, serif; background: var(--cream); color: var(--ink); min-height: 100vh; }

  .masthead { background: var(--ink); color: var(--cream); padding: 2rem 2.5rem 1.5rem; border-bottom: 4px solid var(--tab-accent); }
  .masthead-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .masthead h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.4rem, 3vw, 2.1rem); font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .masthead h1 span { color: var(--tab-accent); display: block; font-style: italic; font-weight: 400; font-size: 0.85em; }
  .masthead-meta { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: #8A8070; line-height: 1.8; flex-shrink: 0; }
  .live-badge { display: inline-flex; align-items: center; gap: 0.35rem; background: rgba(45,74,122,0.3); border: 1px solid var(--tab-accent); color: #9BB3D4; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; padding: 0.2rem 0.55rem; border-radius: 2px; margin-top: 0.5rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .live-dot { width: 5px; height: 5px; background: #4CAF50; border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

  .tab-bar { background: var(--ink); display: flex; padding: 0 2.5rem; border-bottom: 1px solid #2A2520; overflow-x: auto; }
  .tab-btn { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: #6A6458; background: none; border: none; padding: 0.85rem 1.5rem 0.75rem; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: color 0.2s, border-color 0.2s; }
  .tab-btn.active { color: var(--cream); border-bottom-color: var(--tab-accent); }

  .main { max-width: 900px; margin: 0 auto; padding: 2rem 2.5rem 4rem; }

  .status-bar { display: flex; flex-direction: column; gap: 1rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--rule); margin-bottom: 1.5rem; }
  .status-top { display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--muted); }
  
  .controls-row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  #search-bar { flex-grow: 1; min-width: 200px; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; padding: 0.4rem 0.75rem; border: 1px solid var(--rule); background: white; border-radius: 2px; color: var(--ink); outline-color: var(--tab-accent); }
  
  select, .refresh-btn { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tab-accent); background: white; border: 1px solid var(--tab-accent); padding: 0.4rem 0.6rem; border-radius: 2px; cursor: pointer; height: 32px; }
  .refresh-btn:hover { background: var(--tab-accent); color: white; }

  .paper-item { border-bottom: 1px solid var(--rule); padding: 1.25rem 0; cursor: pointer; transition: background 0.1s; }
  .paper-item:hover { background: var(--cream-dark); margin: 0 -1rem; padding-left: 1rem; padding-right: 1rem; }
  .paper-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; line-height: 1.35; margin-bottom: 0.4rem; }
  .paper-meta { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .paper-journal { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--tab-accent); font-weight: 500; }
  
  .badge-link { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--muted); background: var(--cream-dark); padding: 0.1rem 0.4rem; border-radius: 2px; border: 1px solid var(--rule); text-decoration: none; }
  .badge-link:hover { border-color: var(--tab-accent); color: var(--tab-accent); }
  .doi-link { color: #5C3A6B; }

  .abstract-drawer { display: none; background: var(--cream-dark); border: 1px solid var(--rule); border-radius: 2px; padding: 1.25rem 1.5rem; margin-top: 1rem; }
  .abstract-drawer.open { display: block; }
  .abstract-text { font-size: 0.88rem; line-height: 1.7; color: #3A3228; white-space: pre-wrap; }
  
  .drawer-footer { margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--rule); display: flex; gap: 0.75rem; align-items: center; }
  .cite-btn { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; background: var(--tab-accent); color: white; border: none; padding: 0.25rem 0.55rem; border-radius: 2px; cursor: pointer; }

  .loading-state, .error-state, .no-results { text-align: center; padding: 3rem 0; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--rule); border-top-color: var(--tab-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-top">
    <div>
      <h1>Neuro-Oncology<span>Literature Digest</span></h1>
      <div class="live-badge"><div class="live-dot"></div>Live · PubMed</div>
    </div>
    <div class="masthead-meta">
      <div id="fetch-date">—</div>
      <div>pubmed.ncbi.nlm.nih.gov</div>
    </div>
  </div>
</div>

<div class="tab-bar" id="tab-bar">
  <button class="tab-btn active" data-tab="glioma">Glioma</button>
  <button class="tab-btn" data-tab="skull">Skull Base</button>
  <button class="tab-btn" data-tab="srs">SRS</button>
  <button class="tab-btn" data-tab="ocular">Ocular</button>
</div>

<div class="main">
  <div class="status-bar">
    <div class="status-top">
      <div>
        <span id="status-count" style="color:var(--ink); font-weight:500;">—</span>
        <span id="status-msg">Loading latest papers…</span>
      </div>
      <div id="last-updated"></div>
    </div>
    <div class="controls-row">
      <input type="text" id="search-bar" placeholder="Filter by title or author..." oninput="filterResults()">
      <select id="date-range" onchange="refreshTab()">
        <option value="30">30 Days</option>
        <option value="90" selected>90 Days</option>
        <option value="180">180 Days</option>
        <option value="365">1 Year</option>
      </select>
      <button class="refresh-btn" onclick="refreshTab()">↺ Refresh</button>
    </div>
  </div>

  <div class="loading-state" id="loading-state" style="display:none">
    <div class="spinner"></div>
    <div id="loading-steps">Accessing NCBI E-utilities...</div>
  </div>

  <div class="error-state" id="error-state" style="display:none">
    <p id="error-msg">Failed to connect to PubMed.</p>
  </div>

  <div class="paper-list" id="paper-list"></div>
  <div class="no-results" id="no-results" style="display:none">No papers matching your criteria were found.</div>
</div>

<script>
const BASE = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
const API_KEY = ''; // Add your NCBI API key here for 10req/s

const TABS = {
  glioma: { accent: '#2D4A7A', query: '(glioblastoma[tiab] OR "glioma"[tiab] OR "astrocytoma"[tiab] OR "oligodendroglioma"[tiab]) AND ("humans"[MeSH Terms])' },
  skull: { accent: '#4A3728', query: '(meningioma[tiab] OR "vestibular schwannoma"[tiab] OR "acoustic neuroma"[tiab] OR "skull base"[tiab] OR "PitNET"[tiab]) AND ("humans"[MeSH Terms])' },
  srs: { accent: '#1A5C4A', query: '("stereotactic radiosurgery"[tiab] OR "gamma knife"[tiab]) AND ("brain"[tiab] OR "spine"[tiab]) AND ("humans"[MeSH Terms])' },
  ocular: { accent: '#5C3A6B', query: '("uveal melanoma"[tiab] OR "orbital tumor"[tiab] OR "thyroid eye disease"[tiab]) AND ("humans"[MeSH Terms])' }
};

let activeTab = 'glioma';
let currentPapers = [];
let cache = {};

function ui(id) { return document.getElementById(id); }

function fromDate() {
  const days = parseInt(ui('date-range').value);
  const d = new Date(); d.setDate(d.getDate() - days);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

async function loadTab(key, force = false) {
  activeTab = key;
  const range = ui('date-range').value;
  const cacheKey = `${key}-${range}`;

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.documentElement.style.setProperty('--tab-accent', TABS[key].accent);
  ui('search-bar').value = '';

  if (!force && cache[cacheKey]) { 
    currentPapers = cache[cacheKey];
    render(currentPapers); 
    return; 
  }

  ui('loading-state').style.display = 'block';
  ui('paper-list').innerHTML = '';
  ui('no-results').style.display = 'none';

  try {
    const auth = API_KEY ? `&api_key=${API_KEY}` : '';
    const searchUrl = `${BASE}esearch.fcgi?db=pubmed&term=${encodeURIComponent(TABS[key].query)}&sort=pub+date&retmax=15&datetype=pdat&mindate=${fromDate()}&retmode=json${auth}`;
    
    const sRes = await fetch(searchUrl);
    const sData = await sRes.json();
    const ids = sData.esearchresult?.idlist || [];

    if (!ids.length) {
      ui('loading-state').style.display = 'none';
      ui('no-results').style.display = 'block';
      return;
    }

    const sumUrl = `${BASE}esummary.fcgi?db=pubmed&id=${ids.join(',')}&retmode=json${auth}`;
    const rRes = await fetch(sumUrl);
    const rData = await rRes.json();

    currentPapers = ids.map(id => {
      const d = rData.result[id];
      const doi = d.articleids?.find(a => a.idtype === 'doi')?.value;
      return {
        pmid: id,
        doi: doi,
        title: d.title.replace(/\.$/, ''),
        authorsShort: d.authors.map(a => a.name).slice(0, 3).join(', ') + (d.authors.length > 3 ? ' et al.' : ''),
        authorsFull: d.authors.map(a => a.name).join(', '),
        journal: d.source,
        date: d.pubdate,
        abstract: null
      };
    });

    cache[cacheKey] = currentPapers;
    render(currentPapers);
  } catch (err) {
    ui('loading-state').style.display = 'none';
    ui('error-state').style.display = 'block';
  }
}

function filterResults() {
  const query = ui('search-bar').value.toLowerCase();
  const filtered = currentPapers.filter(p => 
    p.title.toLowerCase().includes(query) || 
    p.authorsFull.toLowerCase().includes(query)
  );
  render(filtered);
}

function render(papers) {
  ui('loading-state').style.display = 'none';
  ui('status-count').textContent = `${papers.length} Results`;
  ui('fetch-date').textContent = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  
  const list = ui('paper-list');
  list.innerHTML = papers.map(p => `
    <div class="paper-item" onclick="toggleDrawer('${p.pmid}')">
      <div class="paper-title">${p.title}</div>
      <div style="font-size: 0.82rem; color: var(--muted); font-style: italic;">${p.authorsShort}</div>
      <div class="paper-meta">
        <span class="paper-journal">${p.journal}</span>
        <span style="font-family: 'JetBrains Mono'; font-size: 0.58rem;">${p.date}</span>
        <a class="badge-link" href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank" onclick="event.stopPropagation()">PMID ${p.pmid}</a>
        ${p.doi ? `<a class="badge-link doi-link" href="https://doi.org/${p.doi}" target="_blank" onclick="event.stopPropagation()">DOI</a>` : ''}
      </div>
      <div class="abstract-drawer" id="drw-${p.pmid}">
        <div id="drw-text-${p.pmid}" class="abstract-text">Loading abstract...</div>
        <div class="drawer-footer">
          <button class="cite-btn" onclick="copyCitation(event, '${p.pmid}')">Copy AMA Citation</button>
          <a href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank" style="font-size: 0.6rem; color: var(--tab-accent); margin-left: auto;">View on PubMed ↗</a>
        </div>
      </div>
    </div>
  `).join('');
  
  ui('no-results').style.display = papers.length === 0 ? 'block' : 'none';
}

async function toggleDrawer(pmid) {
  const drw = ui(`drw-${pmid}`);
  const wasOpen = drw.classList.contains('open');
  document.querySelectorAll('.abstract-drawer.open').forEach(d => d.classList.remove('open'));
  if (wasOpen) return;
  drw.classList.add('open');

  const p = currentPapers.find(x => x.pmid === pmid);
  if (p.abstract) { ui(`drw-text-${pmid}`).textContent = p.abstract; return; }

  try {
    const auth = API_KEY ? `&api_key=${API_KEY}` : '';
    const res = await fetch(`${BASE}efetch.fcgi?db=pubmed&id=${pmid}&retmode=xml${auth}`);
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    const nodes = doc.querySelectorAll('AbstractText');
    const abstract = Array.from(nodes).map(n => {
        const label = n.getAttribute('Label');
        return label ? `${label}: ${n.textContent}` : n.textContent;
    }).join('\n\n');
    
    p.abstract = abstract || "No abstract text provided in the PubMed record.";
    ui(`drw-text-${pmid}`).textContent = p.abstract;
  } catch {
    ui(`drw-text-${pmid}`).textContent = "Error fetching abstract from NCBI.";
  }
}

function copyCitation(e, pmid) {
  e.stopPropagation();
  const p = currentPapers.find(x => x.pmid === pmid);
  const citation = `${p.authorsFull}. ${p.title}. ${p.journal}. ${p.date}; PMID: ${p.pmid}.`;
  navigator.clipboard.writeText(citation);
  const btn = e.target;
  const oldText = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = oldText, 2000);
}

function refreshTab() { loadTab(activeTab, true); }

document.getElementById('tab-bar').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (btn) loadTab(btn.dataset.tab);
});

loadTab('glioma');
</script>
</body>
</html>
