<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OncoBill Pro | Clinical Bundles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .bundle-card { border: 2px solid #e2e8f0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .bundle-card:hover { border-color: #6366f1; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-20" x-data="billingApp()">

    <header class="bg-indigo-950 text-white py-6 px-8 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tight">OncoBill <span class="text-indigo-400">v3.1</span></h1>
                <p class="text-[10px] uppercase tracking-widest font-bold text-indigo-300">Advanced Practice Billing 2026</p>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <label class="block text-[10px] font-bold text-indigo-400 uppercase">Current Insurer</label>
                    <select x-model="selectedInsurer" class="bg-indigo-900 border border-indigo-700 rounded text-sm font-bold px-3 py-1 outline-none">
                        <template x-for="pmi in Object.keys(insurers)" :key="pmi">
                            <option :value="pmi" x-text="pmi"></option>
                        </template>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <div class="lg:col-span-8 space-y-8">
            
            <section>
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-8 h-px bg-slate-200"></span> Clinical Pathway Bundles
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button @click="applyBundle('rectal_long')" class="bundle-card bg-white p-6 rounded-2xl text-left group">
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-indigo-100 text-indigo-700 text-[10px] font-black px-2 py-1 rounded-md uppercase">Gastrointestinal</span>
                            <span class="text-indigo-600 font-bold group-hover:translate-x-1 transition">→</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800">Rectal Long-Course CRT</h3>
                        <p class="text-xs text-slate-500 mt-1">Includes: Initial Consult, Complex Planning, 25# Supervision, Chemo Supervision (Capecitabine), & Follow-up.</p>
                    </button>
                    
                    <div class="border-2 border-dashed border-slate-200 rounded-2xl flex items-center justify-center p-6 text-slate-400 italic text-sm">
                        More bundles coming soon...
                    </div>
                </div>
            </section>

            <hr class="border-slate-200">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">1. Consultations</h3>
                    <div class="space-y-2">
                        <template x-for="code in menu.consults">
                            <button @click="addItem(code)" class="w-full bg-white p-3 rounded-xl border border-slate-200 text-left hover:border-indigo-400 transition flex justify-between items-center group">
                                <span class="text-sm font-semibold text-slate-700" x-text="getDesc(code)"></span>
                                <span class="text-[10px] font-bold text-slate-300 group-hover:text-indigo-500" x-text="code"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <div>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">2. Radiotherapy Planning & Supervison</h3>
                    <div class="space-y-2">
                        <template x-for="code in [...menu.rtPlanning, ...menu.rtSupervision]">
                            <button @click="addItem(code)" class="w-full bg-white p-3 rounded-xl border border-slate-200 text-left hover:border-orange-400 transition flex justify-between items-center group">
                                <span class="text-sm font-semibold text-slate-700" x-text="getDesc(code)"></span>
                                <span class="text-[10px] font-bold text-slate-300 group-hover:text-orange-500" x-text="code"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-4">
            <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden sticky top-8">
                <div class="bg-slate-900 p-6 text-white">
                    <h2 class="text-lg font-bold">Billing Statement</h2>
                    <p class="text-xs text-slate-400" x-text="selectedInsurer + ' Schedule'"></p>
                </div>
                
                <div class="p-6 space-y-4 max-h-[500px] overflow-y-auto">
                    <template x-for="(item, index) in activeItems" :key="index">
                        <div class="flex gap-4 border-b border-slate-100 pb-4 relative group">
                            <div class="flex-1">
                                <div class="flex justify-between items-start">
                                    <span class="text-[10px] font-black text-indigo-600 uppercase" x-text="item.code"></span>
                                    <button @click="removeItem(index)" class="text-slate-300 hover:text-red-500 transition">×</button>
                                </div>
                                <p class="text-xs font-bold text-slate-800 leading-tight my-1" x-text="getDesc(item.code)"></p>
                                <div class="flex items-center gap-3 mt-2">
                                    <input type="number" x-model.number="item.fee" class="w-16 text-xs font-bold border rounded p-1">
                                    <span class="text-[10px] text-slate-400">×</span>
                                    <input type="number" x-model.number="item.qty" class="w-10 text-xs border rounded p-1">
                                    <span class="ml-auto font-mono font-bold text-sm" x-text="'£' + (item.fee * item.qty)"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template x-if="activeItems.length === 0">
                        <div class="text-center py-12">
                            <div class="text-slate-200 text-4xl mb-2">🧾</div>
                            <p class="text-xs text-slate-400 italic">Select a bundle or code to begin</p>
                        </div>
                    </template>
                </div>

                <div class="bg-slate-50 p-6 border-t border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-xs font-black text-slate-400 uppercase tracking-widest">Total Estimate</span>
                        <span class="text-3xl font-black text-slate-900" x-text="'£' + calculateGross().toLocaleString()"></span>
                    </div>
                    <button @click="window.print()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-indigo-700 transition">
                        Confirm & Generate Printout
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function billingApp() {
            return {
                selectedInsurer: 'Bupa',
                activeItems: [],
                
                menu: {
                    consults: ['20300', '20355', '20310', '20365'],
                    chemo: ['X0001', 'X0002', 'X0003', 'X0004'],
                    rtPlanning: ['X6910', 'X6930', 'X6950'],
                    rtSupervision: ['X0007', 'X0008', 'X0009', 'X6581'],
                    brachy: ['BT212', 'BT222', 'BT253', 'BT270', 'BT342']
                },

                insurers: {
                    'Bupa': { '20300': 200, '20310': 150, 'X0001': 137, 'X0002': 257, 'X0003': 386, 'X0004': 515, 'X6910': 300, 'X6930': 600, 'X6950': 1466, 'X0007': 380, 'X0008': 720, 'X0009': 960, 'X6581': 25 },
                    'AXA Health': { '20300': 200, '20310': 150, 'X0001': 125, 'X0002': 250, 'X6930': 550 },
                    'Aviva': { '20300': 200, '20310': 150 },
                    'Vitality': { '20300': 200, '20310': 150 },
                    'WPA': { '20300': 200, '20310': 150 }
                },

                descriptions: {
                    '20300': 'Initial Consultation',
                    '20310': 'Follow-up Consultation',
                    'X6930': 'Complex Radiotherapy Planning',
                    'X0008': 'Clinical Supervision EBRT (16-30#)',
                    'X0004': 'Clinical Supervision Chemo (1-28 days)'
                },

                getDesc(code) {
                    return this.descriptions[code] || `Specialist Code ${code}`;
                },

                addItem(code) {
                    const fee = this.insurers[this.selectedInsurer][code] || 0;
                    this.activeItems.push({ code: code, fee: fee, qty: 1 });
                },

                applyBundle(type) {
                    if (type === 'rectal_long') {
                        // 1. New Consult
                        this.addItem('20300');
                        // 2. Complex Planning
                        this.addItem('X6930');
                        // 3. Supervision of 25 fractions (Mapped to X0008: 16-30 fractions)
                        this.addItem('X0008');
                        // 4. Chemo Supervision (28 day cycle for Capecitabine)
                        this.addItem('X0004');
                        // 5. Follow-up
                        this.addItem('20310');
                    }
                },

                removeItem(index) { this.activeItems.splice(index, 1); },
                calculateGross() { return this.activeItems.reduce((sum, i) => sum + (i.fee * i.qty), 0); }
            }
        }
    </script>
</body>
</html>
