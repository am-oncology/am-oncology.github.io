<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prednisolone Weaning Schedule Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            max-width: 900px;
            color: #333;
        }
        h1 { color: #005eb8; } /* NHS Blue */
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f4f5;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #005eb8;
            color: white;
        }
        .week-col {
            background-color: #e8edee;
            font-weight: bold;
        }
        .date-subtext {
            display: block;
            font-size: 0.8em;
            color: #555;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>Prednisolone Weaning Schedule Generator</h1>
    <p>Based on the 24-week gradual prednisolone wean (starting at 5 mg daily) from GUI0644.</p>

    <div class="controls">
        <label for="startDate"><strong>Select Taper Start Date (Monday):</strong></label>
        <input type="date" id="startDate">
        <button onclick="generateSchedule()">Generate Schedule</button>
    </div>

    <div id="scheduleContainer"></div>

    <script>
        // The 24-week schedule array based on Appendix 2 of GUI0644
        const weaningSchedule = [
            [5, 5, 5, 5, 5, 5, 5], // Week 0
            [5, 4, 5, 4, 5, 4, 5], // Week 1
            [4, 4, 4, 4, 4, 4, 4], // Week 2
            [4, 3, 4, 3, 4, 3, 4], // Week 3
            [3, 3, 3, 3, 3, 3, 3], // Week 4 (Test 9am Cortisol here)
            [3, 3, 3, 2, 3, 3, 3], // Week 5
            [3, 2, 3, 3, 2, 3, 3], // Week 6
            [3, 2, 3, 2, 3, 2, 3], // Week 7
            [2, 3, 2, 3, 2, 3, 2], // Week 8
            [2, 3, 2, 2, 3, 2, 2], // Week 9
            [2, 2, 2, 3, 2, 2, 2], // Week 10
            [2, 2, 2, 2, 2, 2, 2], // Week 11
            [2, 2, 2, 1, 2, 2, 2], // Week 12
            [2, 1, 2, 2, 1, 2, 2], // Week 13
            [2, 1, 2, 1, 2, 1, 2], // Week 14
            [1, 2, 1, 2, 1, 2, 1], // Week 15
            [1, 2, 1, 1, 2, 1, 1], // Week 16
            [1, 1, 1, 2, 1, 1, 1], // Week 17
            [1, 1, 1, 1, 1, 1, 1], // Week 18
            [1, 1, 1, 0, 1, 1, 1], // Week 19
            [1, 0, 1, 1, 0, 1, 1], // Week 20
            [1, 0, 1, 0, 1, 0, 1], // Week 21
            [0, 1, 0, 1, 0, 1, 0], // Week 22
            [0, 1, 0, 0, 1, 0, 0], // Week 23
            [0, 0, 0, 1, 0, 0, 0]  // Week 24
        ];

        function generateSchedule() {
            const startDateInput = document.getElementById('startDate').value;
            if (!startDateInput) {
                alert("Please select a start date.");
                return;
            }

            let startDate = new Date(startDateInput);
            
            // Adjust to the previous Monday if a different day is selected
            const day = startDate.getDay();
            const diff = startDate.getDate() - day + (day === 0 ? -6 : 1);
            startDate = new Date(startDate.setDate(diff));

            let html = `<table>
                <thead>
                    <tr>
                        <th>Week</th>
                        <th>Mon</th><th>Tues</th><th>Wed</th><th>Thurs</th><th>Fri</th><th>Sat</th><th>Sun</th>
                    </tr>
                </thead>
                <tbody>`;

            let currentDate = new Date(startDate);

            for (let week = 0; week < weaningSchedule.length; week++) {
                // Highlight week 4 for the cortisol test reminder
                let rowStyle = week === 4 ? 'style="background-color: #fff3cd;"' : '';
                let weekLabel = week === 4 ? `Week 4 <br><small>(Check 9am Cortisol)</small>` : `Week ${week}`;

                html += `<tr ${rowStyle}>
                    <td class="week-col">${weekLabel}</td>`;
                
                for (let day = 0; day < 7; day++) {
                    let dose = weaningSchedule[week][day];
                    let dateString = currentDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                    
                    html += `<td><strong>${dose} mg</strong><span class="date-subtext">${dateString}</span></td>`;
                    
                    // Increment day
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                html += `</tr>`;
            }

            html += `</tbody></table>`;
            
            document.getElementById('scheduleContainer').innerHTML = html;
        }
    </script>
</body>
</html>
