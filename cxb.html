<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CXB Pathway Planner</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        /* Tool-specific print logic */
        @media print {
            header, footer, .input-box, button { display: none !important; }
            main { margin: 0; padding: 0; }
            .result-table { width: 100%; border: 1px solid #000; }
        }
    </style>
</head>
<body>

<header>
    <h1>Dr [Firstname] [Lastname] | Clinical Oncologist</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cxb.html">CXB Planner</a>
    </nav>
</header>

<main>
    <section>
        <h2>Papillon CXB Pathway Planner</h2>
        <p>Clinical timeline generator for patients undergoing Contact X-ray Brachytherapy (CXB).</p>
    </section>

    <section class="input-box" style="background: #f8fafc; border: 1px solid #0f2a44;">
        <div class="card-grid">
            <div>
                <h3>1. Tumour Size</h3>
                <input type="radio" name="size" id="small" value="small" checked> <label for="small">Under 3cm (Direct CXB)</label><br>
                <input type="radio" name="size" id="large" value="large"> <label for="large">Over 3cm (EBRT First)</label>
            </div>
            <div>
                <h3>2. Treatment Start Date</h3>
                <input type="date" id="start-date" onchange="validateMonday(this)" style="padding: 10px; width: 100%;">
                <p id="monday-warning" style="color:red; display:none; font-size: 0.8rem;">⚠️ Please select a Monday.</p>
            </div>
        </div>
        <button onclick="generateSchedule()" class="button-link" style="width: 100%; border: none; cursor: pointer; margin-top: 20px;">Generate Patient Schedule</button>
    </section>

    <div id="schedule-output" style="display:none; margin-top: 2rem;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="pathway-title">Schedule</h3>
            <button onclick="window.print()" class="button-link" style="background: #2d3748;">Print Schedule</button>
        </div>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px; background: white;">
            <thead>
                <tr style="background: #0f2a44; color: white;">
                    <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">Date</th>
                    <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">Action Required</th>
                </tr>
            </thead>
            <tbody id="timeline-body"></tbody>
        </table>
    </div>
</main>

<script>
const bankHolidays = ["2026-04-06", "2026-05-04", "2026-05-25", "2026-08-31", "2027-03-29", "2027-05-03", "2027-05-31", "2027-08-30"];

function validateMonday(input) {
  const date = new Date(input.value);
  const warning = document.getElementById('monday-warning');
  if (date.getDay() !== 1) {
    warning.style.display = 'block';
    input.value = "";
  } else {
    warning.style.display = 'none';
  }
}

function formatDate(date) {
  let d = new Date(date);
  let dateStr = d.toISOString().split('T')[0];
  let isShifted = false;
  if (bankHolidays.includes(dateStr) && d.getDay() === 1) {
    d.setDate(d.getDate() + 1);
    isShifted = true;
  }
  return { 
    text: d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }),
    holiday: isShifted 
  };
}

function addDays(date, days) {
  let result = new Date(date);
  result.setDate(result.getDate() + days);
  return result;
}

function getNextTuesday(date) {
  let d = new Date(date);
  let day = d.getDay();
  let diff = (day <= 2) ? (2 - day) : (9 - day);
  return addDays(d, diff);
}

function generateSchedule() {
  const startDateVal = document.getElementById('start-date').value;
  const isSmall = document.getElementById('small').checked;
  const body = document.getElementById('timeline-body');
  if (!startDateVal) return;

  body.innerHTML = "";
  let base = new Date(startDateVal);
  let events = [];

  const addPapCycle = (startDate, sessionNum) => {
    events.push({ d: addDays(startDate, -3), msg: "Start Low Residue Diet" });
    events.push({ d: addDays(startDate, -1), msg: "Take Picolax Bowel Prep" });
    events.push({ d: startDate, msg: `Papillon Session ${sessionNum}`, type: "high" });
  };

  if (isSmall) {
    document.getElementById('pathway-title').innerText = "Timeline: Tumour < 3cm";
    addPapCycle(base, 1);
    addPapCycle(addDays(base, 14), 2);
    
    // Fraction 3 + Planning CT in same week
    let pap3Date = addDays(base, 28);
    events.push({ d: pap3Date, msg: "Week Commencing: Planning CT Scan" });
    addPapCycle(pap3Date, 3);
    
    // EBRT starts 3rd Monday after Fraction 3 (21 days)
    let ebStart = addDays(pap3Date, 21);
    events.push({ d: ebStart, msg: "Start EBRT", type: "high" });
    let ebEnd = addDays(ebStart, 32); 
    events.push({ d: ebEnd, msg: "Finish EBRT", type: "high" });
    
    let scanWeekStart = addDays(ebEnd, 84);
    events.push({ d: scanWeekStart, msg: "Week Commencing: CT CAP, MRI Pelvis and Flexi Sig" });
    events.push({ d: getNextTuesday(scanWeekStart), msg: "CRC MDT Review", type: "mdt" });

  } else {
    document.getElementById('pathway-title').innerText = "Timeline: Tumour > 3cm";
    events.push({ d: base, msg: "Start EBRT", type: "high" });
    let ebEnd = addDays(base, 32); // Friday finish
    events.push({ d: ebEnd, msg: "Finish EBRT", type: "high" });
    
    // Week 4 post-EBRT: MRI and Proctoscopy
    let postEbrtWk4 = addDays(ebEnd, 24); // Friday to Monday (3) + 3 weeks (21) = 24
    events.push({ d: postEbrtWk4, msg: "Week Commencing: Proctoscopy and MRI Pelvis" });
    
    // Week 5 post-EBRT: MDT
    let postEbrtWk5 = addDays(postEbrtWk4, 7);
    events.push({ d: getNextTuesday(postEbrtWk5), msg: "CRC MDT Review", type: "mdt" });
    
    // Week 6 post-EBRT: Papillon Start
    let p1 = addDays(postEbrtWk4, 14);
    addPapCycle(p1, 1);
    addPapCycle(addDays(p1, 14), 2);
    let p3 = addDays(p1, 28);
    addPapCycle(p3, 3);
    
    let scanWeekStart = addDays(p3, 84);
    events.push({ d: scanWeekStart, msg: "Week Commencing: CT CAP, MRI Pelvis and Flexi Sig" });
    events.push({ d: getNextTuesday(scanWeekStart), msg: "CRC MDT Review", type: "mdt" });
  }

  events.sort((a, b) => a.d - b.d); // Ensure chronological order

  events.forEach(e => {
    let f = formatDate(e.d);
    let rowClass = e.type === 'high' ? 'highlight-row' : (e.type === 'mdt' ? 'mdt-row' : '');
    body.innerHTML += `<tr class="${rowClass}">
      <td class="date-col">${f.text}${f.holiday ? '<span class="holiday-tag">Adjusted to Tuesday (Bank Hol)</span>' : ''}</td>
      <td style="font-weight: ${e.type === 'high' ? 'bold' : 'normal'}">${e.msg}</td>
    </tr>`;
  });
  document.getElementById('schedule-output').style.display = 'block';
}
</script>
</body>
</html>
