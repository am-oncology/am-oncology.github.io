<head>

    <link rel="stylesheet" href="assets/style.css">
    <style>
        /* Tool-specific print logic */
        @media print {
            header, footer, .input-box, button { display: none !important; }
            main { margin: 0; padding: 0; }
            .result-table { width: 100%; border: 1px solid #000; }
        }
    </style>
</head>
<body>

<header>
    <h1>Dr [Firstname] [Lastname]</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cxb.html">CXB Planner</a>
    </nav>
</header>

<main>
    <section>
        <h2>Papillon CXB Pathway Planner</h2>
        <p>Clinical timeline generator for patients undergoing Contact X-ray Brachytherapy.</p>
    </section>

    <section class="input-box" style="background: #f8fafc; border: 1px solid #0f2a44;">
        <div class="card-grid">
            <div>
                <h3>1. Tumour Size</h3>
                <input type="radio" name="size" id="small" value="small" checked> <label for="small">Under 3cm (Direct CXB)</label><br>
                <input type="radio" name="size" id="large" value="large"> <label for="large">Over 3cm (EBRT First)</label>
            </div>
            <div>
                <h3>2. Treatment Start Date</h3>
                <input type="date" id="start-date" onchange="validateMonday(this)" style="padding: 10px; width: 100%;">
                <p id="monday-warning" style="color:red; display:none; font-size: 0.8rem;">⚠️ Please select a Monday.</p>
            </div>
        </div>
        <button onclick="generateSchedule()" class="button-link" style="width: 100%; border: none; cursor: pointer; margin-top: 20px;">Generate Patient Schedule</button>
    </section>

    <div id="schedule-output" style="display:none; margin-top: 2rem;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="pathway-title">Schedule</h3>
            <button onclick="window.print()" class="button-link" style="background: #2d3748;">Print Schedule</button>
        </div>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px; background: white;">
            <thead>
                <tr style="background: #0f2a44; color: white;">
                    <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">Date</th>
                    <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">Action Required</th>
                </tr>
            </thead>
            <tbody id="timeline-body"></tbody>
        </table>
    </div>
</main>
